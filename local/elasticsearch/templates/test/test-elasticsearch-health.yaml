---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "elasticsearch.test.pod.fullname" . }}"
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
  - name: "{{ .Release.Name }}-{{ randAlpha 5 | lower }}-test"
    image: "{{ include "elasticsearch.imageRegistry" . }}/{{ .Values.imageRepository }}:{{ .Values.imageTag }}"
    securityContext: {{- toYaml .Values.securityContext | nindent 6 }}
    command:
      - "sh"
      - "-c"
      - |
        #!/usr/bin/env bash -e
        curl -XGET --fail '{{ include "elasticsearch.service.fullname" . }}:{{ .Values.httpPort }}/_cluster/health?{{ .Values.clusterHealthCheckParams }}'
  restartPolicy: Never
