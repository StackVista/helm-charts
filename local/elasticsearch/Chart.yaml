apiVersion: v2
description: Internal dependency of the suse-observability chart; not supported as a standalone chart.
home: https://github.com/elastic/helm-charts
name: elasticsearch
version: 8.19.4
appVersion: 8.19.4
sources:
  - https://github.com/elastic/elasticsearch
icon: https://helm.elastic.co/icons/elasticsearch.png
maintainers:
  - name: SUSE Observability Ops Team
    email: suse-observability-ops@suse.com
dependencies:
  - name: common
    repository: file://../common
    version: "*"
  - name: prometheus-elasticsearch-exporter
    repository: file://../prometheus-elasticsearch-exporter
    version: "*"
    condition: prometheus-elasticsearch-exporter.enabled
  - name: suse-observability-sizing
    repository: file://../suse-observability-sizing
    version: "*"
