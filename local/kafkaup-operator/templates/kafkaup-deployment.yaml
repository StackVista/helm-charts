{{- $commonContainer := fromYaml (include "common.container" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafkaup-operator.deployment.fullname" . }}
  namespace: {{.Release.Namespace}}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: kafka
    {{- include "kafkaup-operator.commonLabels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalue.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ default 1 .Values.replicaCount | int }}
  selector:
    matchLabels:
      app: {{ include "common.fullname.short" . }}-kafkaup
{{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
{{- end }}
  template:
    metadata:
      labels:
        app: {{ include "common.fullname.short" . }}-kafkaup
        {{- $podLabels := merge (dict) .Values.podLabels (include "kafkaup-operator.commonLabels" . | fromYaml) }}
        {{- with $podLabels }}
        {{- include "common.tplvalue.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      annotations:
        {{ include "kafkaup-operator.checksum-configs" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalue.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kafkaup-operator.serviceaccount.fullname" . }}
      {{- include "kafkaup.image.pullSecret.name" . | nindent 6 }}
      containers:
      - name: kafkaup-operator
        image: "{{ include "common.image.registry" (dict "image" .Values.image "context" .) }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - start
        - --namespace
        - {{ .Release.Namespace }}
        - -vv
        securityContext:
          {{- $commonContainer.securityContext | toYaml | nindent 10 }}
        volumeMounts:
        - name: kafkaup-config-volume
          mountPath: /conf.d
{{- $sizingResources := include "common.sizing.kafkaup-operator.resources" . | trim }}
{{- $sizingResourcesDict := fromYaml $sizingResources }}
{{- $evaluatedResources := merge (dict) .Values.resources $sizingResourcesDict }}
{{- with $evaluatedResources }}
        resources:
{{- toYaml . | nindent 10 }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
      {{- with include "common.scheduling.tolerations" (dict "layers" (list .Values.tolerations) "context" $) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- $generated := include "common.sizing.kafkaup-operator.affinityConfig" . | fromYaml -}}
      {{- with include "common.scheduling.infraAffinity" (dict "layers" (list .Values.affinity) "generated" $generated "context" $) }}
      affinity: {{- include "common.tplvalues.render" (dict "value" (fromYaml .) "context" $) | nindent 8 }}
      {{- end }}
{{- if .Values.securityContext.enabled }}
      securityContext: {{- omit .Values.securityContext "enabled" | toYaml | nindent 8 }}
{{- end }}
      volumes:
      - name: kafkaup-config-volume
        configMap:
          name: {{ include "kafkaup-operator.configmap.fullname" . }}
