name: Updatecli Git authentication

on:
  push:
    paths:
      - .github/workflows/updatecli-git-auth.yml
      - scripts/ci/updatecli_squash_push.sh
      - scripts/ci/updatecli_squash_push.test.cjs
      - scripts/ci/configure_git.sh

permissions:
  contents: read

jobs:
  read_repository:
    if: github.repository == 'StackVista/helm-charts-internal'
    runs-on: docker
    container:
      image: ${{ vars.REGISTRY_QUAY_URL }}/stackstate/sts-ci-images:stackstate-devops-c30c515e
      options: --user 0:0
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # Match follow_up's token scope so this probes the same authentication boundary.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.HELM_CHARTS_INTERNAL_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELM_CHARTS_INTERNAL_GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Read target ref with follow-up credentials
        env:
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_ACCESS_ONLY: "true"
        run: |
          ./scripts/ci/configure_git.sh
          ./scripts/ci/updatecli_squash_push.sh unused master unused
      - name: Reject inherited credentials in favor of the current token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_ACCESS_ONLY: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.https://github.com/StackVista/helm-charts-internal.git.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: basic eC1hY2Nlc3MtdG9rZW46aW52YWxpZA=="
        run: ./scripts/ci/updatecli_squash_push.sh unused master unused
