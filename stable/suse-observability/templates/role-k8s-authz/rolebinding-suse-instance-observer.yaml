{{- /* Does not use common.rolebinding: custom K8s authorization binding with specific structure */ -}}
{{- define "stackstate.k8s.authorization.instance.observer.rolebinding" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stackstate.k8s.authorization.instance.observer.rolebinding.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "stackstate.k8s.authorization.instance.observer.role.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{/* External group identity: keep independent of Role and RoleBinding name helpers. */}}
subjects:
  - kind: Group
    name: {{ template "common.fullname.short" . }}-instance-observer
{{- end -}}

{{- if (include "suse-observability.features.enabled" (dict "key" "role-k8s-authz" "context" .)) -}}
{{- include "stackstate.k8s.authorization.instance.observer.rolebinding" . -}}
{{- end -}}
