{{- /* Does not use common.rolebinding: custom K8s authorization binding with specific structure */ -}}
{{- define "stackstate.k8s.authorization.instance.recommended.rolebinding" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stackstate.k8s.authorization.instance.recommendedAccess.rolebinding.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "stackstate.k8s.authorization.instance.recommendedAccess.role.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: "system:authenticated"
{{- end -}}

{{- if (include "suse-observability.features.enabled" (dict "key" "role-k8s-authz" "context" .)) -}}
{{- include "stackstate.k8s.authorization.instance.recommended.rolebinding" . -}}
{{- end -}}
