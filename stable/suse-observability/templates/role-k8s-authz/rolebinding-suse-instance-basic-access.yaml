{{- /* Does not use common.rolebinding: custom K8s authorization binding with specific structure */ -}}
{{- define "stackstate.k8s.authorization.instance.base.rolebinding" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stackstate.k8s.authorization.instance.basicAccess.rolebinding.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "stackstate.k8s.authorization.instance.basicAccess.role.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: "system:authenticated"
{{- end -}}

{{- if .Values.stackstate.k8sAuthorization.enabled -}}
{{- include "stackstate.k8s.authorization.instance.base.rolebinding" . -}}
{{- end -}}
