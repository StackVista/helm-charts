{{- define "stackstate.backup-config.hbase.secret" -}}
{{- $escapedBucketName := .Values.backup.stackGraph.bucketName | replace "_" "___" | replace "-" "__" | replace "." "_" -}}
metadata:
  {{- /* Using a globally unique name here, because the hbase subhcart should pickup this secret */}}
  name: {{ template "common.fullname.global" (merge (dict "Base" "backup") .) }}-sts-hbase-backup
stringData:
  HBASE_CONF_fs_s3a_bucket_{{ $escapedBucketName }}_access_key: {{ include "stackstate.s3proxy.accessKey" . | quote }}
  HBASE_CONF_fs_s3a_bucket_{{ $escapedBucketName }}_secret_key: {{ include "stackstate.s3proxy.secretKey" . | quote }}
{{- end -}}

{{- $commonSecret := fromYaml (include "common.secret" .) -}}
{{- $stackstateBackupHBaseEnvSecret := fromYaml (include "stackstate.backup-config.hbase.secret" .) -}}
{{- toYaml (merge $stackstateBackupHBaseEnvSecret $commonSecret) -}}
