{{- define "stackstate.replicationChecker.serviceaccount" -}}
metadata:
  name: {{ include "stackstate.replicationChecker.fullname" . }}
  labels:
    app.kubernetes.io/component: replication-checker
    {{- include "suse-observability.labels.global" . | nindent 4 }}
{{- end -}}

{{- $commonServiceAccount := fromYaml (include "common.serviceaccount" .) -}}
{{- $replicationCheckerServiceAccount := fromYaml (include "stackstate.replicationChecker.serviceaccount" .) -}}
{{- if eq (include "stackstate.replicationChecker.enabled" .) "true" }}
{{- toYaml (merge $replicationCheckerServiceAccount $commonServiceAccount) -}}
{{- end -}}
