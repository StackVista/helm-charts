{{- define "stackstate.rolebinding.get-pods" -}}
metadata:
  name: {{ include "stackstate.getPods.rolebinding.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "stackstate.getPods.role.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
{{- if include "suse-observability.features.enabled" (dict "key" "server.split" "context" .) }}
- kind: ServiceAccount
  name: {{ include "stackstate.api.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.authorizationSync.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.checks.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.initializer.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.slicing.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.state.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.sync.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.notification.serviceaccount.fullname" . }}
- kind: ServiceAccount
  name: {{ include "stackstate.healthSync.serviceaccount.fullname" . }}
{{- else }}
- kind: ServiceAccount
  name: {{ include "stackstate.server.serviceaccount.fullname" . }}
{{- end -}}
{{- end -}}

{{- $commonRoleBinding := fromYaml (include "common.rolebinding" .) -}}
{{- $getPodsRoleBinding := fromYaml (include "stackstate.rolebinding.get-pods" .) -}}
{{- toYaml (merge $getPodsRoleBinding $commonRoleBinding) -}}
