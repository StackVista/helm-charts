{{- define "stackstate.stackpacks.scripts.configmap" -}}
metadata:
  name: {{ include "stackstate.stackpacks.scripts.configmap.fullname" . }}
data:
  copy-stackpacks.sh: |-
    {{- tpl (.Files.Get "scripts/copy-stackpacks.sh") . | trim | nindent 4 }}
{{- end -}}
{{- if eq .Values.stackstate.stackpacks.source "docker-image" }}
{{- $commonConfigMap := fromYaml (include "common.configmap" .) -}}
{{- $stackpacksScriptsConfigMap := fromYaml (include "stackstate.stackpacks.scripts.configmap" .) -}}
{{- toYaml (merge $stackpacksScriptsConfigMap $commonConfigMap) -}}
{{- end }}
