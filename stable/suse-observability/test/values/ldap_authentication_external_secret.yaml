stackstate:
  authentication:
    ldap:
      host: ldap-server
      port: 10389
      bind:
        dn: ou=acme,dc=com
        password: foobar
      ssl:
        type: ssl
        trustStoreFromExternalSecret:
          name: "my-ldap-truststore"
          key: "cacerts"
        trustCertificatesFromExternalSecret:
          name: "my-ldap-truststore"
          key: "certificates.pem"
      userQuery:
        emailKey: email
        usernameKey: cn
        parameters:
          - ou: employees
          - dc: stackstate
          - dc: com
      groupQuery:
        groupMemberKey: member
        rolesKey: cn
        parameters:
          - ou: groups
          - dc: stackstate
          - dc: com
