        tag: "1.8.6-so60"
      # victoria-metrics-1.backup.setupCron.resources -- Resources of the container that sets up the backup cron schedule.
      # @section -- Public
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 20m
          memory: 64Mi
    vmbackup:
      image:
        # victoria-metrics-1.backup.vmbackup.image.tag -- VM backup image tag. Updated by updatecli.
        # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
        tag: "1.155.0-so13"
      # victoria-metrics-1.backup.vmbackup.resources -- Resources of the Victoria Metrics backup container.
      # @section -- Public
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          cpu: 100m
          memory: 512Mi
    # victoria-metrics-1.backup.bucketName -- Name of the storage bucket where Victoria Metrics backups are stored.
    # @section -- Public
    bucketName: 'sts-victoria-metrics-backup'
    # victoria-metrics-1.backup.s3Prefix -- Prefix (dir name) used to store backup files, we may have multiple instances of Victoria Metrics, each of them should be stored into their own directory.
    # @section -- Public
    s3Prefix: victoria-metrics-1
