    # victoria-metrics-1.backup.minHistorySeconds -- Whole number of seconds; refuse the hourly backup when local storage holds no data older than this while the destination already holds a completed backup, so a rebuilt instance cannot overwrite a backup it has not restored from. `0` disables the check. Must stay below this instance's retention (above it, no data can ever be that old and backups are refused permanently, not only after a redeploy) and at or under 40 days (above that VictoriaMetrics ignores the query time range and the check silently passes). Durations such as `1d` are not accepted.
    # @section -- Public
    minHistorySeconds: 86400
