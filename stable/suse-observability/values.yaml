      # @section -- Public
      hourly: '35 * * * *'
      # victoria-metrics-1.backup.scheduled.daily -- Cron schedule for daily snapshot backups of Victoria Metrics
      # @section -- Public
      daily: '5 1 * * *'
    # victoria-metrics-1.backup.keepLastDaily -- Number of daily backups to retain
    # @section -- Public
    keepLastDaily: 7
    # victoria-metrics-1.backup.keepLastWeekly -- Number of weekly backups to retain
