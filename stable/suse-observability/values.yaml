      # @section -- Public
      size: 1Gi
      # stackstate.stackpacks.localpvc.storageClass -- Storage class of the PVC used to persist stackpacks when there is no HDFS.
      # @section -- Public
      storageClass:
    pvc:
      # stackstate.stackpacks.pvc.size -- Size of the Persistent Volume Claim (PVC) used to copy stackpacks from the Docker image.
      # @section -- Public
      size: 1Gi
      # stackstate.stackpacks.pvc.storageClass -- Storage class of the PVC used to copy stackpacks from the Docker image.
      # @section -- Public
      storageClass:
    # stackstate.stackpacks.images -- Built-in StackPack images mounted by the init containers. Updated by updatecli; add custom images with `stackstate.stackpacks.extraImages`.
    # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
    images:
      # name for the init container
      - name: "v1"
        # `registry` used for the `stackpacks` Docker image; this will override `global.imageRegistry` on a per-service basis.
        registry: "quay.io"
        # `pullPolicy` used for the `stackpacks` Docker image; this will override `stackstate.components.all.image.pullPolicy` on a per-service basis.
        pullPolicy: ""
        # Repository of the `stackpacks` Docker image.
        repository: stackstate/stackpacks
        # Version used for the `stackpacks` Docker image, the tag is build from the version and the stackstate edition + deployment mode
        version: "20261105145246-master-4ef2487"
        # Use the stackpacks from another deployment mode than StackState is running in
        deploymentModeOverride: ""
        # name for the init container
      - name: core
        # `registry` used for the `stackpacks` Docker image; this will override `global.imageRegistry` on a per-service basis.
        registry: "quay.io"
        # `pullPolicy` used for the `stackpacks` Docker image; this will override `stackstate.components.all.image.pullPolicy` on a per-service basis.
        pullPolicy: ""
        # Repository of the `stackpacks` Docker image.
        repository: stackstate/core-stackpacks
        # Tag used for the `stackpacks` Docker image
        tag: "20261120143952-main-9033cdd"
        # name for the init container
      - name: suse
        # `registry` used for the `stackpacks` Docker image; this will override `global.imageRegistry` on a per-service basis.
        registry: "quay.io"
        # `pullPolicy` used for the `stackpacks` Docker image; this will override `stackstate.components.all.image.pullPolicy` on a per-service basis.
        pullPolicy: ""
        # Repository of the `stackpacks` Docker image.
        repository: stackstate/suse-stackpacks
        # Tag used for the `stackpacks` Docker image
        tag: "platform-20261120135422-main-f1d430b"
        # Editions that include the stackpacks
        editions: ["Prime"]
    # stackstate.stackpacks.extraImages -- Additional stackpack Docker images to mount after the built-in stackpack images.
    # @section -- Public
    extraImages: []
  ui:
    # stackstate.ui.defaultTimeRange -- Default time range  in the UI. One of LAST_5_MINUTES, LAST_15_MINUTES, LAST_30_MINUTES, LAST_1_HOUR, LAST_3_HOURS, LAST_6_HOURS, LAST_12_HOURS, LAST_24_HOURS, LAST_2_DAYS. No value or an unsupported value will automatically fall-back to LAST_1_HOUR.
    # @section -- Public
    defaultTimeRange:
