#####################
# StackState values #
#####################
# Every value carries a support level on the line after its description:
#   Public    "@section -- Public". Safe to set: keeps working across upgrades, and a
#             rename, change of meaning or removal is announced in the release notes
#             and preceded by a deprecation period. Listed in README.md.
#   Internal  The helm-docs ignore tag. Chart wiring, per-image settings, most
#             replica counts, JVM sizing blocks, deprecated and debug
#             settings. May change or be removed in any release without notice;
#             overriding one is not supported. Not listed in README.md.
# A block described as a whole carries one level for all its keys. A new value
# needs a description and one of these markers.

global:
  # global.receiverApiKey -- Deprecated. Use global.suseObservability.receiverApiKey instead.
  # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
  receiverApiKey: ""
  # global.imagePullSecrets -- List of image pull secret names to be used by all images across all charts.
  # @section -- Public
  imagePullSecrets: []
  # global.imageRegistry -- Image registry to be used by all images across all charts.
  # When using global.suseObservability (global mode), set this to "registry.rancher.com" to match
  # the default behavior of the suse-observability-values chart.
  # @section -- Public
  imageRegistry:
  # global.storageClass -- StorageClass for all PVCs created by the chart. Can be overridden per PVC.
  # @section -- Public
  storageClass:
  # global.commonLabels -- Labels that will be added to all Deployments, StatefulSets, CronJobs, Jobs and their pods
  # @section -- Public
  commonLabels: {}
  features:
    # global.features.experimentalOtelLogs -- Enable OpenTelemetry-based log ingestion to signal to all components that they should support it
    # alongside legacy Elasticsearch-based log ingestion, preserving backwards compatibility between the two while OTel-based logs are
    # rolled out. This is a preproduction feature, usage may change in upcoming releases.
    # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
    experimentalOtelLogs: false
    # global.features.experimentalOtelClusterTopology -- Tell agents that the platform maps OTel cluster topology. Agents with the OTel Kubernetes topology exporter then stop sending legacy topology; older agents are unaffected. This is a preproduction feature: enable only once the Kubernetes StackPack has feature parity with Kubernetes-V2.
    # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
    experimentalOtelClusterTopology: false
  backup:
    # global.backup.enabled -- Enables backup/restore for all data
    # @section -- Public
    enabled: false
  wait:
    image:
      # global.wait.image.registry -- Base container image registry for wait containers.
      # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
      registry: quay.io
      # global.wait.image.repository -- Base container image repository for wait containers.
      # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
      repository: stackstate/wait
      # global.wait.image.tag -- Container image tag for wait containers.
      # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
      tag: "1.0.12-so25"
      # global.wait.image.pullPolicy -- Image pull policy for wait containers.
      # @ignored Internal: overriding it is not supported, and it may change or be removed in any release without notice.
      pullPolicy: IfNotPresent
  # Simplified configuration section that allows users to specify high-level settings.
  # When any values in this section are configured (license, baseUrl, sizing.profile, etc.), the chart will
  # automatically use this configuration instead of the legacy stackstate.* values.
  # This provides a single-chart installation experience without needing the separate suse-observability-values chart.
  # NOTE: This section works in conjunction with existing global settings (imageRegistry, receiverApiKey, imagePullSecrets).
  # IMPORTANT: When using this section, also set global.imageRegistry to "registry.rancher.com" for SUSE Observability images.
  suseObservability:
    # global.suseObservability.license -- SUSE Observability license key (required when using global.suseObservability).
    # @section -- Public
    license: ""
    # global.suseObservability.baseUrl -- Base URL for SUSE Observability (required when using global.suseObservability).
    # @section -- Public
    baseUrl: ""
    # global.suseObservability.adminPassword -- Admin password for the default 'admin' user (plain text). Mutually exclusive with adminPasswordBcrypt. Required (one of the two) when using global.suseObservability configuration unless other authentication methods (LDAP, OIDC, Keycloak) are configured.
    # @section -- Public
    adminPassword: ""
    # global.suseObservability.adminPasswordBcrypt -- Admin password as bcrypt hash. Mutually exclusive with adminPassword.
    # @section -- Public
    adminPasswordBcrypt: ""
    # Image pull secret configuration.
    pullSecret:
      # global.suseObservability.pullSecret.username -- Username for image pull secret.
      # @section -- Public
      username: ""
      # global.suseObservability.pullSecret.password -- Password for image pull secret.
      # @section -- Public
      password: ""
    sizing:
      # global.suseObservability.sizing.profile -- Sizing profile name. Must match one of the available profiles: 10-nonha, 20-nonha, 50-nonha, 100-nonha, 150-ha, 250-ha, 500-ha, 4000-ha, trial. The chart will automatically apply resource limits, replica counts, and affinity configurations based on the selected profile. These act as intelligent defaults that can be overridden by component-specific values.
      # @section -- Public
      profile: ""
    # global.suseObservability.applicationDomains -- Enabled application domains. Default is ["Observability"]. Only "Observability" is currently supported.
    # @section -- Public
    applicationDomains:
      - "Observability"
    # global.suseObservability.receiverApiKey -- Optional, prefer to use Service Tokens instead for more control and better security. Will use stackstate.apiKey.key if not provided, stackstate.apiKey can also be used to provide the apiKey via an external secret.
    # Please see the documentation on how to use Service Tokens instead.
    # @section -- Public
    receiverApiKey: ""
    # global.suseObservability.tolerations -- Tolerations applied to every SUSE Observability workload, including subcharts, hooks, backup and restore jobs and CronJobs. A component's own tolerations (or `stackstate.components.all.tolerations`) replace this list rather than extending it; set them to `[]` to clear.
    # @section -- Public
    tolerations: null
    # Affinity configuration for all SUSE Observability components including infrastructure. Resolved per field (nodeAffinity, podAffinity, podAntiAffinity): a component value, then `stackstate.components.all`, then this global value; set a field to `{}` to clear it.
    affinity:
      # global.suseObservability.affinity.nodeAffinity -- Node affinity configuration applied to all components (application and infrastructure). Standard Kubernetes nodeAffinity spec.
      # @section -- Public
      nodeAffinity: null
      # global.suseObservability.affinity.podAffinity -- Pod affinity configuration for application components only. Does NOT apply to infrastructure components. Standard Kubernetes podAffinity spec.
      # @section -- Public
      podAffinity: null
      # Simplified pod anti-affinity configuration for HA profiles. Applied to all infrastructure components (kafka, clickhouse, zookeeper, elasticsearch, hbase, victoria-metrics) for HA profiles.
      podAntiAffinity:
        # global.suseObservability.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution -- Enable required (hard) pod anti-affinity. When true, pods must be scheduled on different nodes. When false, soft anti-affinity is used (preferred but not required).
        # @section -- Public
        requiredDuringSchedulingIgnoredDuringExecution: true
        # global.suseObservability.affinity.podAntiAffinity.topologyKey -- Topology key for pod anti-affinity. Determines the domain for spreading pods (e.g., kubernetes.io/hostname for node-level, topology.kubernetes.io/zone for zone-level).
        # @section -- Public
        topologyKey: "kubernetes.io/hostname"
  s3proxy:
    credentials:
      # global.s3proxy.credentials.accessKey -- Access key for S3Proxy authentication (override for production usage with global.backup.enabled)
      # @section -- Public
      accessKey: "default-for-settings-only"
      # global.s3proxy.credentials.secretKey -- Secret key for S3Proxy authentication (override for production usage with global.backup.enabled)
      # @section -- Public
      secretKey: "default-secret-for-settings-only"
      # global.s3proxy.credentials.fromExternalSecret -- Use an externally-managed secret for credentials (keys: accesskey, secretkey). When set, the chart will not create a secret and accessKey/secretKey values are not required.
      # @section -- Public
      fromExternalSecret: ""
# commonLabels -- Labels that will be added to all resources created by the stackstate chart (not the subcharts though)
# @section -- Public
commonLabels: {}
backup:
  # backup.additionalLogging -- Additional logback config for backup components
  # @section -- Public
  additionalLogging: ""
  # backup.enabled -- Enables backup/restore for all data
  # @section -- Public
  enabled: false
  # backup.initJobAnnotations -- Annotations for Backup-init Job.
  # @section -- Public
  initJobAnnotations: {}
  manualJobs:
    # backup.manualJobs.containerSecurityContext -- Container security overrides for all manual Elasticsearch, StackGraph, configuration and VictoriaMetrics backup/restore Jobs embedded in the backup scripts ConfigMap, including their init containers. Merged over common.container.securityContext; explicit false and zero override inherited values. Does not affect scheduled backups, the settings-PVC initializer, or other workloads. Pod security remains controlled by the component's securityContext.
    # @section -- Public
    containerSecurityContext: {}
  storage:
    # PVC for local settings backup (always present)
    settingsPvc:
      # backup.storage.settingsPvc.size -- Size of the settings backup PVC
      # @section -- Public
      size: 2Gi
      # backup.storage.settingsPvc.storageClass -- Storage class for the settings PVC
      # @section -- Public
      storageClass: ""
      # backup.storage.settingsPvc.accessModes -- Access modes for the settings PVC
      # @section -- Public
      accessModes:
        - ReadWriteOnce
    backend:
      # Use local PVC storage (default when no other backend configured)
      pvc:
        # backup.storage.backend.pvc.enabled -- Enable PVC backend
        # @section -- Public
        enabled: false
        # backup.storage.backend.pvc.size -- Size of the PVC for S3Proxy data
        # @section -- Public
        size: 500Gi
        # backup.storage.backend.pvc.storageClass -- Storage class for the PVC
        # @section -- Public
        storageClass: ""
        # backup.storage.backend.pvc.accessModes -- Access modes for the PVC
        # @section -- Public
        accessModes:
          - ReadWriteOnce
      # Use external S3-compatible storage
      s3:
        # backup.storage.backend.s3.enabled -- Enable S3 backend
        # @section -- Public
        enabled: false
        # backup.storage.backend.s3.fromExternalSecret -- Use an externally-managed secret for S3 backend credentials (keys: backendAccessKey, backendSecretKey). When set, accessKey/secretKey values are not required.
        # @section -- Public
        fromExternalSecret: ""
        # backup.storage.backend.s3.accessKey -- AWS access key (optional, falls back to instance profile/IRSA)
        # @section -- Public
        accessKey: ""
        # backup.storage.backend.s3.secretKey -- AWS secret key (optional)
        # @section -- Public
        secretKey: ""
        # backup.storage.backend.s3.endpoint -- S3 endpoint URL (optional, defaults to AWS)
        # @section -- Public
        endpoint: ""
        # backup.storage.backend.s3.region -- AWS region (defaults to us-east-1)
        # @section -- Public
        region: null
      # Use Azure Blob Storage
      azure:
        # backup.storage.backend.azure.enabled -- Enable Azure backend
        # @section -- Public
        enabled: false
        # backup.storage.backend.azure.fromExternalSecret -- Use an externally-managed secret for Azure backend credentials (keys: azureAccountName, azureAccountKey). When set, accountName/accountKey values are not required.
        # @section -- Public
        fromExternalSecret: ""
        # backup.storage.backend.azure.accountName -- Azure storage account name
        # @section -- Public
        accountName: ""
        # backup.storage.backend.azure.accountKey -- Azure storage account key (optional, falls back to managed identity)
        # @section -- Public
        accountKey: ""
        # backup.storage.backend.azure.endpoint -- Azure blob endpoint (auto-derived from accountName if not set)
        # @section -- Public
        endpoint: ""
  elasticsearch:
    # backup.elasticsearch.enabled -- Enable scheduled ElasticSearch snapshots (creation of the SLM policy). Set to false to disable (do NOT use an invalid cron schedule). Only takes effect when global.backup.enabled is true.
    # @section -- Public
    enabled: true
    # backup.elasticsearch.bucketName -- Name of the storage bucket where ElasticSearch snapshots are stored.
    # @section -- Public
    bucketName: 'sts-elasticsearch-backup'
    # backup.elasticsearch.s3Prefix -- Prefix (dir name) used to store backup files.
    # @section -- Public
    s3Prefix: ""
    scheduled:
      # backup.elasticsearch.scheduled.schedule -- Cron schedule for automatic ElasticSearch snaphosts in [ElasticSearch cron schedule syntax](https://www.elastic.co/guide/en/elasticsearch/reference/7.6/cron-expressions.html).
      # @section -- Public
      schedule: "0 0 3 * * ?"
      # backup.elasticsearch.scheduled.snapshotRetentionExpireAfter -- Amount of time to keep ElasticSearch snapshots in [ElasticSearch time units](https://www.elastic.co/guide/en/elasticsearch/reference/7.6/common-options.html#time-units). *Note:* By default, the retention task itself [runs daily at 1:30 AM UTC](https://www.elastic.co/guide/en/elasticsearch/reference/7.6/slm-settings.html#slm-retention-schedule).
      # @section -- Public
      snapshotRetentionExpireAfter: "30d"
      # backup.elasticsearch.scheduled.snapshotRetentionMinCount -- Minimum number of ElasticSearch snapshots to keep. *Note:* By default, the retention task itself [runs daily at 1:30 AM UTC](https://www.elastic.co/guide/en/elasticsearch/reference/7.6/slm-settings.html#slm-retention-schedule).
      # @section -- Public
      snapshotRetentionMinCount: "5"
      # backup.elasticsearch.scheduled.snapshotRetentionMaxCount -- Minimum number of ElasticSearch snapshots to keep. *Note:* By default, the retention task itself [runs daily at 1:30 AM UTC](https://www.elastic.co/guide/en/elasticsearch/reference/7.6/slm-settings.html#slm-retention-schedule).
      # @section -- Public
      snapshotRetentionMaxCount: "30"
    securityContext:
      # backup.elasticsearch.securityContext.enabled -- Whether or not to enable the securityContext
      # @section -- Public
      enabled: true
      # backup.elasticsearch.securityContext.fsGroup -- The GID (group ID) of all files on all mounted volumes
      # @section -- Public
      fsGroup: 65534
      # backup.elasticsearch.securityContext.runAsGroup -- The GID (group ID) of the owning user of the process
      # @section -- Public
      runAsGroup: 65534
      # backup.elasticsearch.securityContext.runAsNonRoot -- Ensure that the user is not root (!= 0)
      # @section -- Public
      runAsNonRoot: true
      # backup.elasticsearch.securityContext.runAsUser -- The UID (user ID) of the owning user of the process
      # @section -- Public
      runAsUser: 65534
  poddisruptionbudget:
    # backup.poddisruptionbudget.maxUnavailable -- Maximum number of pods that can be unavailable during the backup.
    # @section -- Public
    maxUnavailable: 0
  stackGraph:
    # backup.stackGraph.enabled -- Enable scheduled StackGraph backups. Set to false to disable (do NOT use an invalid cron schedule). Only takes effect when global.backup.enabled is true.
    # @section -- Public
    enabled: true
    # backup.stackGraph.bucketName -- Name of the storage bucket to store StackGraph backups.
    # @section -- Public
    bucketName: 'sts-stackgraph-backup'
    # backup.stackGraph.s3Prefix -- Prefix (dir name) used to store backup files.
    # @section -- Public
    s3Prefix: ""
    restore:
      tempData:
        # backup.stackGraph.restore.tempData.accessModes -- Access mode for temporary backup data.
        # @section -- Public
        accessModes: ["ReadWriteOnce"]
        # backup.stackGraph.restore.tempData.size -- Size of volume for temporary backup data; must be large enough to store a single backup. It defaults to a datanode size on Distributed Mode and to the stackgraph size on Mono mode.
        # @section -- Public
        size: null
        # backup.stackGraph.restore.tempData.storageClass -- Storage class of the volume for temporary backup data.
        # @section -- Public
        storageClass:
    scheduled:
      # backup.stackGraph.scheduled.implementation -- Allows choosing the backup implementation to run on a schedule, can be "v1", "v2" or "all". For now the default is "v1", due to the v2 system not declared 'stable' yet. Not-schedule jobs will be suspended.
      # @section -- Public
      implementation: "all"
      # backup.stackGraph.scheduled.schedule -- Cron schedule for automatic StackGraph backups in [Kubernetes cron schedule syntax](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#cron-schedule-syntax).
      # @section -- Public
      schedule: "0 3 * * *"
      # backup.stackGraph.scheduled.backupRetentionTimeDelta -- Time to keep StackGraph backups in. The value is passed to GNU date tool  to determine a specific date, and files older than this date will be deleted.
      # @section -- Public
      backupRetentionTimeDelta: "30 days ago"
      tempData:
        # backup.stackGraph.scheduled.tempData.accessModes -- Access mode for temporary backup data.
        # @section -- Public
        accessModes: ["ReadWriteOnce"]
        # backup.stackGraph.scheduled.tempData.size -- Size of volume for temporary backup data; must be large enough to store a single backup. It defaults to a datanode size on Distributed Mode and to the stackgraph size on Mono mode.
        # @section -- Public
        size: null
        # backup.stackGraph.scheduled.tempData.storageClass -- Storage class of the volume for temporary backup data.
        # @section -- Public
        storageClass:
    v2:
      tempData:
        # backup.stackGraph.v2.tempData.accessModes -- Access mode for temporary backup data.
        # @section -- Public
        accessModes: ["ReadWriteOnce"]
        # backup.stackGraph.v2.tempData.size -- Size of volume for temporary backup data; only used as a buffer for sending data to s3, so does not need to fit a complete backup.
        # @section -- Public
        size: "20Gi"
        # backup.stackGraph.v2.tempData.storageClass -- Storage class of the volume for temporary backup data.
        # @section -- Public
        storageClass:
    securityContext:
      # backup.stackGraph.securityContext.enabled -- Whether or not to enable the securityContext
      # @section -- Public
      enabled: true
      # backup.stackGraph.securityContext.fsGroup -- The GID (group ID) of all files on all mounted volumes
      # @section -- Public
      fsGroup: 65534
      # backup.stackGraph.securityContext.runAsGroup -- The GID (group ID) of the owning user of the process
      # @section -- Public
      runAsGroup: 65534
      # backup.stackGraph.securityContext.runAsNonRoot -- Ensure that the user is not root (!= 0)
      # @section -- Public
      runAsNonRoot: true
      # backup.stackGraph.securityContext.runAsUser -- The UID (user ID) of the owning user of the process
      # @section -- Public
      runAsUser: 65534
  configuration:
    # backup.configuration.enabled -- Enable scheduled configuration/settings backups. Set to false to disable (do NOT use an invalid cron schedule). Runs independently of global.backup.enabled (writes a local settings snapshot); the remote upload step is separately gated by global.backup.enabled.
    # @section -- Public
    enabled: true
    # backup.configuration.bucketName -- Name of the storage bucket to store configuration backups.
    # @section -- Public
    bucketName: 'sts-configuration-backup'
    # backup.configuration.s3Prefix -- Prefix (dir name) used to store backup files.
    # @section -- Public
    s3Prefix: ""
    yaml:
      # backup.configuration.yaml.maxSizeLimit -- Max size of the settings backup or installed via a stackpack
      # @section -- Public
      maxSizeLimit: "100Mi"
    # backup.configuration.maxLocalFiles -- The maximum number of configuration backups stored on the settings PVC (see backup.storage.settingsPvc.size). Each backup consists of a settings file and a StackPacks archive; StackPacks archives without a matching settings file are removed.
    # @section -- Public
    maxLocalFiles: 10
    scheduled:
      # backup.configuration.scheduled.schedule -- Cron schedule for automatic configuration backups in [Kubernetes cron schedule syntax](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#cron-schedule-syntax).
      # @section -- Public
      schedule: "0 4 * * *"
      # backup.configuration.scheduled.backupRetentionTimeDelta -- Time to keep configuration backups. The value is passed to GNU date tool to determine a specific date, and files older than this date will be deleted.
      # @section -- Public
      backupRetentionTimeDelta: "365 days ago"
      pvc:
        # backup.configuration.scheduled.pvc.accessModes -- Access mode for settings backup data.
        # @section -- Public
        accessModes: ["ReadWriteOnce"]
        # backup.configuration.scheduled.pvc.size -- Size of volume for settings backup
        # @section -- Public
        size: "1Gi"
        # backup.configuration.scheduled.pvc.storageClass -- Storage class of the volume for settings backup data.
        # @section -- Public
        storageClass:
    securityContext:
      # backup.configuration.securityContext.enabled -- Whether or not to enable the securityContext
      # @section -- Public
      enabled: true
      # backup.configuration.securityContext.fsGroup -- The GID (group ID) of all files on all mounted volumes
      # @section -- Public
      fsGroup: 65534
      # backup.configuration.securityContext.runAsGroup -- The GID (group ID) of the owning user of the process
      # @section -- Public
      runAsGroup: 65534
      # backup.configuration.securityContext.runAsNonRoot -- Ensure that the user is not root (!= 0)
      # @section -- Public
      runAsNonRoot: true
      # backup.configuration.securityContext.runAsUser -- The UID (user ID) of the owning user of the process
      # @section -- Public
      runAsUser: 65534
deployment:
  # deployment.compatibleWithArgoCD -- Whether to adjust the Chart to be compatible with ArgoCD. This feature is as of yet
  # not deployed in the o11y-tenants and saas-tenants directories, so should be considered unfinished (see STAC-21445)
  # @section -- Public
  compatibleWithArgoCD: false
ingress:
  # ingress.annotations -- Annotations for ingress objects.
  # @section -- Public
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # ingress.enabled -- Enable use of ingress controllers.
  # @section -- Public
  enabled: false
  # ingress.ingressClassName -- Ingress class name for the ingress object.
  # @section -- Public
  ingressClassName: ""
  # ingress.path -- Path of the ingress rule for each host.
  # @section -- Public
  path: /
  # ingress.hosts -- List of ingress hostnames; the paths are fixed to StackState backend services
  # @section -- Public
  hosts: []
  # - host: stackstate.local
  # ingress.tls -- List of ingress TLS certificates to use.
  # @section -- Public
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - stackstate.local
# Gateway API configuration for exposing SUSE Observability via HTTPRoute.
gateway:
  # gateway.enabled -- Enable Gateway API HTTPRoute for SUSE Observability.
  # @section -- Public
  enabled: false
  # gateway.annotations -- Annotations for HTTPRoute objects.
  # @section -- Public
  annotations: {}
  # gateway.parentRefs -- List of parent Gateway references (required when gateway.enabled is true).
  # @section -- Public
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-namespace
  #   sectionName: websecure
  # gateway.hostnames -- List of hostnames for the HTTPRoute. If not specified, derived from baseUrl.
  # @section -- Public
  hostnames: []
  # gateway.path -- Path prefix for the HTTPRoute rule. If not specified, derived from baseUrl or defaults to "/".
  # @section -- Public
  path: ""
  # gateway.filters -- Optional filters for the HTTPRoute rule.
  # @section -- Public
  filters: []
  # gateway.timeouts -- Optional timeouts for the HTTPRoute rule.
  # @section -- Public
  timeouts: {}
  # request: 30s
  # backendRequest: 30s
  # gateway.backendWeight -- Optional weight for traffic splitting.
  # @section -- Public
  backendWeight: null
networkPolicy:
  # networkPolicy.enabled -- Enable creating of `NetworkPolicy` object and associated rules for StackState.
  # @section -- Public
  enabled: false
  # networkPolicy.spec -- `NetworkPolicy` rules for StackState.
  # @section -- Public
  spec:
    ingress:
      - from:
          - podSelector: {}
    podSelector:
      matchLabels: {}
    policyTypes:
      - Ingress
scc:
  # scc.enabled -- Create `SecurityContextConstraints` resource to manage Openshift security constraints for Stackstate.
  # Has to be enabled when installing to Openshift >= 4.12
  # The resource is deployed as a Helm pre-install hook to avoid any warning for the first deployment.
  # Because `helm uninstall` does not consider Helm hooks, the resource must be manually deleted after the Helm release is removed.
  # @section -- Public
  enabled: false
#########################################
# AI and Advanced Optimization Features #
#########################################
# Note: These features are General Availability (GA) but disabled by default because you need to provide an LLM to be able to use them.
ai:
  # AI Assistant & MCP Server. Entitlement: Included with SUSE Observability (Rancher Prime)
  assistant:
    # ai.assistant.enabled -- Enables the AI Assistant UI, the dedicated backend process, and the MCP (Model Context Protocol) Server for Observability. Enabling the AI Assistant always enables the MCP Server.
    # @section -- Public
    enabled: false
    # ai.assistant.provider -- LLM provider for AI Assistant. Possible values: `bedrock` or `anthropic`.
    # @section -- Public
    provider: bedrock
    anthropic:
      # ai.assistant.anthropic.apiKey -- Anthropic API key used when `ai.assistant.provider=anthropic`.
      # @section -- Public
      apiKey: ""
      fromExternalSecret:
        # ai.assistant.anthropic.fromExternalSecret.name -- Existing secret name that contains the Anthropic API key. When set, the chart will not create an internal secret for `ANTHROPIC_API_KEY`.
        # @section -- Public
        name: ""
        # ai.assistant.anthropic.fromExternalSecret.key -- Key in the external secret that contains the Anthropic API key.
        # @section -- Public
        key: ANTHROPIC_API_KEY
    bedrock:
      # ai.assistant.bedrock.awsRegion -- AWS region used when `ai.assistant.provider=bedrock`.
      # @section -- Public
      awsRegion: eu-west-1
  # MCP (Model Context Protocol) Server for use with external code assistants. Entitlement: Included with SUSE Observability (Rancher Prime)
  mcp:
    # ai.mcp.enabled -- Enables the MCP Server for use with external code assistants, without enabling the AI Assistant or configuring an LLM provider. The MCP Server is also enabled automatically when `ai.assistant.enabled=true`.
    # @section -- Public
    enabled: false
  # Automatic Troubleshooting & Remediation. Entitlement: Requires 'SUSE Platform Optimization' add-on (part of Rancher Suite). Enabling this flag indicates you have the appropriate license for Platform Optimization.
  platformOptimization:
    # ai.platformOptimization.enabled -- Enables advanced AI-driven automatic troubleshooting extensions. This builds upon the AI Assistant framework to provide proactive issue resolution.
    # @section -- Public
    enabled: false
stackstate:
  components:
    all:
      deploymentStrategy:
        # stackstate.components.all.deploymentStrategy.type -- Deployment strategy for StackState components. Possible values: `RollingUpdate`, `Recreate` and `RecreateSingletonsOnly`.
        # `RecreateSingletonsOnly` uses `Recreate` for the singleton Deployments and `RollingUpdate` for the other Deployments.
        # @section -- Public
        type: RecreateSingletonsOnly
      # stackstate.components.all.envsFromExistingSecrets -- Configure environment variables from existing secrets.
      # envsFromExistingSecret
      # - name: MY_SECRET_ENV_VAR
      #   secretName: my-k8s-secret
