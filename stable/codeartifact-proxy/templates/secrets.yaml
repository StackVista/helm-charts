{{/*
Client-facing HTTP Basic Auth credentials (PACKAGE_REGISTRY_PROXY_USER/TOKEN), unrelated to the
CodeArtifact authorization token. The nginx configuration lives in a plain ConfigMap
(configmap-nginx-config.yaml) since it never carries a secret value.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codeartifact-proxy.fullname" . }}-htpasswd
  labels:
    {{- include "codeartifact-proxy.labels" . | nindent 4 }}
stringData:
  .htpasswd: {{ .Values.auth.htpasswd | quote }}
