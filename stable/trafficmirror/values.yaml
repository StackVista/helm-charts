container:
  livenessProbeDefaults:
    # container.livenessProbeDefaults.enabled -- Use defaults for the `livenessProbe` from the upstream `common` chart.
    enabled: true
  readinessProbeDefaults:
    # container.readinessProbeDefaults.enabled -- Use defaults for the `readinessProbe` from the upstream `common` chart.
    enabled: true

image:
  # image.repository -- Base container image repository.
  repository: ghcr.io/rb3ckers/trafficmirror
  # image.tag -- Default container image tag.
  tag: v2.5.5

service:
  # service.appProtocol -- Optional appProtocol for the service port. Set to `kubernetes.io/h2c` for gRPC / HTTP2 cleartext backends so a Gateway API `HTTPRoute` forwards HTTP/2 upstream.
  appProtocol: ""

ingress:
  # ingress.enabled -- Enable use of ingress controllers.
  enabled: false
  # ingress.annotations -- Annotations for `Ingress` objects.
  annotations: {}
  # ingress.hosts -- List of ingress hostnames.
  hosts: []
  # - host: chart-example.local
  #   paths:
  #     - path: /?(.*)
  #       pathType: ImplementationSpecific
  # ingress.tls -- List of ingress TLS certificates to use.
  tls: []
  #  - secretName: chart-example-tls

gateway:
  # gateway.enabled -- Enable Gateway API routes (HTTPRoute/GRPCRoute) for trafficmirror. Mutually exclusive with ingress.enabled.
  enabled: false
  # gateway.kind -- Route kind to create. Valid values: "HTTPRoute" or "GRPCRoute".
  kind: HTTPRoute
  # gateway.annotations -- Annotations for the route object.
  annotations: {}
  # gateway.parentRefs -- List of parent `Gateway` references (required when gateway.enabled is true).
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-namespace
  #   sectionName: websecure
  # gateway.hostnames -- List of hostnames for the route. If empty, the route matches all hosts.
  hostnames: []
  # gateway.path -- Path prefix for the HTTPRoute rule (ignored for GRPCRoute).
  path: /
  # gateway.pathType -- Path match type for the HTTPRoute rule (ignored for GRPCRoute).
  pathType: PathPrefix
  # gateway.filters -- Optional filters for the route rule.
  filters: []
  # gateway.timeouts -- Optional timeouts for the HTTPRoute rule (ignored for GRPCRoute).
  timeouts: {}
  # request: 30s
  # backendRequest: 30s
  # gateway.backendWeight -- Optional weight for traffic splitting.
  backendWeight:
  # gateway.additionalGateways -- Additional route objects (e.g. a GRPCRoute alongside an HTTPRoute). Each entry takes the same fields as this block.
  additionalGateways: []

trafficmirror:
  # trafficmirror.mainUrl -- The default URL to receive the mirrored traffic.
  mainUrl: ""
  # trafficmirror.mirrorUrls -- The additional URLs that should also receive mirrored traffic.
  mirrorUrls: []
  # trafficmirror.password -- Basic auth password for the Trafficmirror service.
  password: ""
  # trafficmirror.username -- Basic auth username for the Trafficmirror service.
  username: ""
  # trafficmirror.failAfterMinutes -- Remove a target when it has been failing for this many minutes.
  failAfterMinutes: 30
  # trafficmirror.retryAfterMinutes -- After 5 successive failures a target is temporarily disabled, it will be retried after this many minutes.
  retryAfterMinutes: 1
  # trafficmirror.maxQueuedRequests -- Max requests that gets queued per mirror target.
  maxQueuedRequests: 3000
  # trafficmirror.mainTargetDelayMs -- Delay executions to main target, this gives the mirror time to catch up, and increases parallelism.
  mainTargetDelayMs: 200
  # trafficmirror.enablePProf -- Enable pprof profiling
  enablePProf: false
deployment:
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
