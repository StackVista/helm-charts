global:
  # global.imageRegistry -- Globally override the image registry that is used. Can be overridden by specific containers. Defaults to quay.io
  imageRegistry: null
  # global.imagePullSecrets -- Globally add image pull secrets that are used.
  imagePullSecrets: []
image:
  # image.registry -- Registry containing the image for the Redirector
  registry:
  # image.repository -- Repository containing the image for the Redirector
  repository: stackstate/redirector
  # image.tag -- Tag of the image for the Redirector
  tag: v0.0.3
  # image.pullPolicy -- Pull policy for the image for the Redirector
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: 25m
    memory: 32Mi
  requests:
    cpu: 25m
    memory: 32Mi
# tolerations -- Tolerations for the pods
tolerations: null
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
replicaCount: 2
ingress:
  enabled: false
  path: /

gateway:
  # gateway.enabled -- Enable Gateway API `HTTPRoute` for redirector. Mutually exclusive with ingress.enabled.
  enabled: false
  # gateway.annotations -- Annotations for the `HTTPRoute` object.
  annotations: {}
  # gateway.parentRefs -- List of parent `Gateway` references (required when gateway.enabled is true).
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-namespace
  #   sectionName: websecure
  # gateway.hostnames -- List of hostnames for the `HTTPRoute`. If empty, the route matches all hosts.
  hostnames: []
  # gateway.path -- Path prefix for the `HTTPRoute` rule.
  path: /
  # gateway.filters -- Optional filters for the `HTTPRoute` rule.
  filters: []
  # gateway.timeouts -- Optional timeouts for the `HTTPRoute` rule.
  timeouts: {}
  # request: 30s
  # backendRequest: 30s
  # gateway.backendWeight -- Optional weight for traffic splitting.
  backendWeight:

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - redirector
      topologyKey: kubernetes.io/hostname
