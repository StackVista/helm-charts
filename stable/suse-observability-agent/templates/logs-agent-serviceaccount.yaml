{{- $agent := ternary .Values.otelLogsAgent .Values.logsAgent .Values.global.features.experimentalOtelLogsAgent }}
{{- if $agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-logs-agent
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: logs-agent
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
{{- with $agent.serviceaccount.annotations }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end -}}
