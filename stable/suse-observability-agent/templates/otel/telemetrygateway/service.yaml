{{- if include "stackstate-k8s-agent.otelTelemetryGateway.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stackstate-k8s-agent.otelTelemetryGateway.name" . }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-telemetry-gateway
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
  {{- with ((.Values.otel.telemetryGateway.service).annotations) }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    - port: 13133
      targetPort: health
      protocol: TCP
      name: health
    - port: 8888
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
{{ include "stackstate-k8s-agent.otelTelemetryGateway.selectorLabels" . | indent 4 }}
{{- end }}
