{{- if include "stackstate-k8s-agent.otelTelemetryGateway.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stackstate-k8s-agent.otelTelemetryGateway.name" . }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-telemetry-gateway
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
  {{- with ((.Values.otel.telemetryGateway.serviceaccount).annotations) }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
