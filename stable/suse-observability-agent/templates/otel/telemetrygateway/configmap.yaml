{{- if include "stackstate-k8s-agent.otelTelemetryGateway.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stackstate-k8s-agent.otelTelemetryGateway.configName" . }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-telemetry-gateway
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/self:
        config:
          scrape_configs:
            - job_name: opentelemetry-collector
              scrape_interval: 30s
              static_configs:
                - targets:
                    - ${env:POD_IP}:8888
                  labels:
                    k8s.pod.uid: ${env:POD_UID}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Step 1: strip client-supplied security-sensitive attributes so k8s_attributes sets authoritative values.
      # k8s_attributes (step 2) repopulates k8s.namespace.name from the Kubernetes API.
      # transform (step 3) overwrites k8s.cluster.name from agent config regardless of what k8s_attributes set.
      transform/pre-k8sattributes:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "k8s.cluster.name")
              - delete_key(resource.attributes, "k8s.namespace.name")
        metric_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "k8s.cluster.name")
              - delete_key(resource.attributes, "k8s.namespace.name")
        log_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "k8s.cluster.name")
              - delete_key(resource.attributes, "k8s.namespace.name")
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          labels:
            - from: pod
              key_regex: (.*)
              tag_name: $$1
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      transform/enrich-resource:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(resource.attributes["service.instance.id"], resource.attributes["k8s.pod.uid"]) where resource.attributes["service.instance.id"] == nil and resource.attributes["k8s.pod.uid"] != nil
              - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
        metric_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(resource.attributes["service.instance.id"], resource.attributes["k8s.pod.uid"]) where resource.attributes["service.instance.id"] == nil and resource.attributes["k8s.pod.uid"] != nil
              - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
        log_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(resource.attributes["service.instance.id"], resource.attributes["k8s.pod.uid"]) where resource.attributes["service.instance.id"] == nil and resource.attributes["k8s.pod.uid"] != nil
              - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
      transform/self-metrics:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(resource.attributes["k8s.namespace.name"], "${env:K8S_NAMESPACE_NAME}")
              - set(resource.attributes["service.namespace"], "${env:K8S_NAMESPACE_NAME}") where resource.attributes["service.namespace"] == nil
      batch: {}

    connectors:
      span_metrics:
        # Bound generated span-metric cardinality so one high-cardinality service
        # cannot exhaust gateway memory. Overflow series are marked with
        # otel.metric.overflow="true" by the connector.
        aggregation_cardinality_limit: {{ .Values.otel.telemetryGateway.spanMetrics.aggregationCardinalityLimit }}
        resource_metrics_key_attributes:
          - service.name
          - service.namespace
          - k8s.cluster.name
          - k8s.namespace.name
        histogram:
          unit: s
        metrics_expiration: 5m
        namespace: otel_span

{{- $exporterName := ternary "otlp/suse-observability" "otlp_http/suse-observability" (eq (include "stackstate-k8s-agent.platform.otlp.useGrpc" .) "true") }}
    exporters:
      {{ $exporterName }}:
        auth:
          authenticator: bearertokenauth
        endpoint: ${env:PLATFORM_OTLP_ENDPOINT}
        tls:
          insecure_skip_verify: ${env:SKIP_SSL_VALIDATION}
        compression: gzip
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
{{- include "stackstate-k8s-agent.collector.debugExporter.config" .Values.otel.telemetryGateway.debug | nindent 6 }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      bearertokenauth:
        scheme: SUSEObservability
        token: "${env:STS_API_KEY}"

    service:
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      extensions: [health_check, pprof, bearertokenauth]
      pipelines:
        traces/gateway:
          receivers: [otlp]
          processors: [memory_limiter, transform/pre-k8sattributes, k8s_attributes, transform/enrich-resource, batch]
          exporters: [span_metrics, {{ $exporterName }}{{ include "stackstate-k8s-agent.collector.debugExporter.suffix" (dict "debug" .Values.otel.telemetryGateway.debug "signal" "traces") }}]
        metrics/gateway:
          receivers: [otlp, span_metrics]
          processors: [memory_limiter, transform/pre-k8sattributes, k8s_attributes, transform/enrich-resource, batch]
          exporters: [{{ $exporterName }}{{ include "stackstate-k8s-agent.collector.debugExporter.suffix" (dict "debug" .Values.otel.telemetryGateway.debug "signal" "metrics") }}]
        metrics/self:
          receivers: [prometheus/self]
          processors: [memory_limiter, transform/self-metrics, batch]
          exporters: [{{ $exporterName }}]
        logs/gateway:
          receivers: [otlp]
          processors: [memory_limiter, transform/pre-k8sattributes, k8s_attributes, transform/enrich-resource, batch]
          exporters: [{{ $exporterName }}{{ include "stackstate-k8s-agent.collector.debugExporter.suffix" (dict "debug" .Values.otel.telemetryGateway.debug "signal" "logs") }}]
{{- end }}
