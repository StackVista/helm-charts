{{- if and (include "stackstate-k8s-agent.otelPrometheusScraping.enabled" .) (gt (.Values.otel.prometheusScraping.collector.replicaCount | int) 1) }}
{{- if and (.Capabilities.APIVersions.Has "policy/v1") (semverCompare ">=1.21-0" .Capabilities.KubeVersion.Version) }}
apiVersion: policy/v1
{{- else }}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "stackstate-k8s-agent.otelMetricsScraper.name" . }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-metrics-scraper
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
spec:
{{- include "stackstate-k8s-agent.pdb.unhealthyPodEvictionPolicy" (dict "context" . "budget" .Values.otel.prometheusScraping.collector.podDisruptionBudget) | nindent 2 }}
  maxUnavailable: 1
  selector:
    matchLabels:
{{ include "stackstate-k8s-agent.otelMetricsScraper.selectorLabels" . | indent 6 }}
{{- end }}
