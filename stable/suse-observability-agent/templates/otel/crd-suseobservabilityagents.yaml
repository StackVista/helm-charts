{{- if include "stackstate-k8s-agent.otelMarkerCrd.enabled" . }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: suseobservabilityagents.observability.suse.com
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  group: observability.suse.com
  names:
    kind: SUSEObservabilityAgent
    listKind: SUSEObservabilityAgentList
    plural: suseobservabilityagents
    singular: suseobservabilityagent
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >
            Marker CRD. The presence of this CRD signals that this cluster has
            an agent-managed SUSE Observability OTel integration path that other
            charts may integrate with, such as Prometheus scraping or the
            telemetry gateway. This is a capability signal only, not endpoint
            discovery. No instances of this resource are created or reconciled.
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
