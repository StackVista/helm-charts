{{- if and .Values.global.features.experimentalOtelLogsAgent .Values.otelLogsAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-otel-logs-agent
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-logs-agent
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
{{- with .Values.otelLogsAgent.serviceaccount.annotations }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end -}}
