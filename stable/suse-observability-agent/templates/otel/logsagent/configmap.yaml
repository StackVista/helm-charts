{{- if and .Values.global.features.experimentalOtelLogsAgent .Values.otelLogsAgent.enabled }}
{{- $mode := .Values.otelLogsAgent.exportMode }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-logs-agent
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: otel-logs-agent
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
data:
  otel-logs.yaml: |
    extensions:
      file_storage/logs:
        # Checkpoints survive container restarts but track file reads, not backend acknowledgement.
        directory: /var/lib/otelcol/checkpoints
        create_directory: true
        recreate: false
      stslogsagent/logs:
    {{- if eq $mode "auto" }}
        # Select one destination at startup; capability changes request a graceful restart.
        discovery_enabled: true
    {{- else }}
        # A fixed destination never queries /features.
        discovery_enabled: false
        fixed_mode: {{ $mode }}
    {{- end }}
        receiver_url: ${env:RECEIVER_URL}
        api_key: ${env:STS_API_KEY}
        proxy_url: ${env:PROXY_URL}
        tls:
          insecure_skip_verify: {{ or .Values.global.skipSslValidation .Values.otelLogsAgent.skipSslValidation }}
        state_directory: /var/lib/otelcol/controller
        health_endpoint: 0.0.0.0:13133
        termination_message_path: /dev/termination-log
    {{- if ne $mode "promtail" }}
      bearertokenauth/native:
        scheme: SUSEObservability
        token: ${env:STS_API_KEY}
    {{- end }}
    receivers:
      file_log/pods:
        # Each DaemonSet instance collects only node-local pod logs.
        include: [/var/log/pods/*/*/*.log]
        exclude:
          - /var/log/pods/${env:POD_NAMESPACE}_${env:POD_NAME}_*/logs-agent/*.log
        include_file_path: true
        start_at: beginning
        preserve_trailing_whitespaces: true
        storage: file_storage/logs
        max_concurrent_files: 4
        max_log_size: 256KiB
        retry_on_failure:
          # Only the selected exporter retries; Filelog and the routing connector do not retry.
          enabled: false
        operators:
          - type: container
            id: container
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ div (mul (include "stackstate-k8s-agent.logsAgent.memoryMiB" . | int) 2) 3 }}
        spike_limit_mib: {{ max 1 (div (include "stackstate-k8s-agent.logsAgent.memoryMiB" . | int) 6) }}
      transform/static_pod:
        # Static-pod log paths contain config hashes; resolve the API pod UID by name and namespace.
        error_mode: propagate
        log_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "k8s.pod.uid") where resource.attributes["k8s.pod.uid"] != nil and not IsMatch(resource.attributes["k8s.pod.uid"], "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")
      k8s_attributes:
        auth_type: serviceAccount
        # Wait for the initial pod-cache sync before Filelog starts emitting records.
        wait_for_metadata: true
        filter:
          # Restrict metadata watches to the collector's node.
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
      transform/cluster:
        error_mode: propagate
        log_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.cluster.name"], "${env:CLUSTER_NAME}")
    connectors:
      stslogsroute/logs:
        controller_extension: stslogsagent/logs
        promtail_pipeline: logs/promtail
    {{- if ne $mode "promtail" }}
        native_pipeline: logs/native
    {{- end }}
        max_concurrent_calls: 8
        # Drop oversized records individually and split valid records under the same deadline.
        max_record_bytes: 262144
        max_request_bytes: 1048576
        # Delivery and retries share one deadline within the Pod's termination grace period.
        export_lifetime: 90s
    exporters:
      stsk8slogs/promtail:
        # The router selects this Promtail endpoint or the native OTLP destination.
        endpoint: ${env:PROMTAIL_LOGS_URL}
        api_key: ${env:STS_API_KEY}
        proxy_url: ${env:PROXY_URL}
        tls:
          insecure_skip_verify: {{ or .Values.global.skipSslValidation .Values.otelLogsAgent.skipSslValidation }}
        cluster_name: ${env:CLUSTER_NAME}
        timeout: 5s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
        sending_queue:
          # Keep exports synchronous so shutdown can account for every admitted call.
          enabled: false
    {{- if ne $mode "promtail" }}
      {{ if include "stackstate-k8s-agent.platform.otlp.useGrpc" . }}otlp{{ else }}otlp_http{{ end }}/native:
        endpoint: ${env:NATIVE_OTLP_URL}
    {{- if not (include "stackstate-k8s-agent.platform.otlp.useGrpc" .) }}
        proxy_url: ${env:PROXY_URL}
    {{- end }}
        tls:
          insecure_skip_verify: {{ or .Values.global.skipSslValidation .Values.otelLogsAgent.skipSslValidation }}
        auth:
          authenticator: bearertokenauth/native
        timeout: 5s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
        sending_queue:
          # Keep exports synchronous so shutdown can account for every admitted call.
          enabled: false
    {{- end }}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      extensions: [file_storage/logs, stslogsagent/logs{{ if ne $mode "promtail" }}, bearertokenauth/native{{ end }}]
      pipelines:
        logs/input:
          receivers: [file_log/pods]
          processors: [memory_limiter, transform/static_pod, k8s_attributes, transform/cluster]
          exporters: [stslogsroute/logs]
        logs/promtail:
          receivers: [stslogsroute/logs]
          exporters: [stsk8slogs/promtail]
    {{- if ne $mode "promtail" }}
        logs/native:
          receivers: [stslogsroute/logs]
          exporters: [{{ if include "stackstate-k8s-agent.platform.otlp.useGrpc" . }}otlp{{ else }}otlp_http{{ end }}/native]
    {{- end }}
{{- end -}}
