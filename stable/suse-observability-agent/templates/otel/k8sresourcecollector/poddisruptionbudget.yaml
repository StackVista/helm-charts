{{- if and (include "stackstate-k8s-agent.k8sResourceCollector.enabled" .) (gt (.Values.otel.k8sResourceCollector.replicaCount | int) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-k8s-resource-collector
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: k8s-resource-collector
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
spec:
{{- include "stackstate-k8s-agent.pdb.unhealthyPodEvictionPolicy" (dict "context" . "budget" .Values.otel.k8sResourceCollector.podDisruptionBudget) | nindent 2 }}
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: k8s-resource-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "stackstate-k8s-agent.name" . }}
{{- end }}
