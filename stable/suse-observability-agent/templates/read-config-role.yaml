apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-read-config
  labels:
{{ include "stackstate-k8s-agent.labels" . | indent 4 }}
{{ include "stackstate-k8s-agent.global.extraLabels" . | indent 4 }}
    app.kubernetes.io/component: read-config
  annotations:
{{ include "stackstate-k8s-agent.global.extraAnnotations" . | indent 4 }}
rules:
  - apiGroups: [""]
    resourceNames:
      - {{ template "stackstate-k8s-agent.clusterName.configmap.internal.name" . }}
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
