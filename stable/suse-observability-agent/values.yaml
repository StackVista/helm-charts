#####################
# General variables #
#####################

global:
  # global.imageRegistry -- The image registry to use.
  imageRegistry: "quay.io"
  extraEnv:
    # global.extraEnv.open -- Extra open environment variables to inject into pods.
    open: {}
    # global.extraEnv.secret -- Extra secret environment variables to inject into pods via a `Secret` object.
    secret: {}
  # global.imagePullSecrets -- Secrets / credentials needed for container image registry.
  imagePullSecrets: []
  # global.imagePullCredentials -- Globally define credentials for pulling images.
  imagePullCredentials: {}
  proxy:
    # global.proxy.url -- Proxy for all traffic to stackstate
    url: ""
  # global.skipSslValidation -- Enable tls validation from client
  skipSslValidation: false
  # global.customCertificates -- Custom certificates for HTTPS endpoints
  customCertificates:
    # global.customCertificates.enabled -- Enable custom certificate injection
    enabled: false
    # global.customCertificates.configMapName -- Name of existing ConfigMap containing certificates (exclusive with pemData)
    configMapName: ""
    # global.customCertificates.pemData -- PEM-encoded certificate data (exclusive with configMapName), will be stored as tls.pem
    pemData: ""

  # global.extraLabels -- Extra labels added ta all resources created by the helm chart
  extraLabels: {}
  # global.extraAnnotations -- Extra annotations added ta all resources created by the helm chart
  extraAnnotations: {}

  features:
    # global.features.experimentalStackpacks -- Enable StackPacks 2.0 to signal to all components that they should support the StackPacks 2.0 spec. When enabled, the cluster collector (CRD discovery) is automatically activated.
    experimentalStackpacks: false

  # global.receiverApiKey -- This is deprecated and will be removed in a future version.
  # receiverApiKey:

  # global.clusterAgentAuthToken.fromSecret -- The secret from from which the token for authenticating between node and cluster agent will be taken.
  # Overriding this will allow setting the api key from an externally provided secret.
  # The api key will be picked form the STS_CLUSTER_AGENT_AUTH_TOKEN value
  clusterAgentAuthToken:
    fromSecret: '{{ include "stackstate-k8s-agent.secret.internal.name" . }}'

  # global.apiKey.fromSecret -- The secret from which the receiver api key is taken. Will execute as a template.
  # Overriding this will allow setting the api key from an externally provided secret.
  # The api key will be picked form the STS_API_KEY value
  apiKey:
    fromSecret: '{{ include "stackstate-k8s-agent.secret.internal.name" . }}'

# nameOverride -- Override the name of the chart.
nameOverride: ""
# fullnameOverride -- Override the fullname of the chart.
fullnameOverride: ""

# targetSystem -- Target OS for this deployment (possible values: linux)
targetSystem: "linux"

########################
# StackState variables #
########################

stackstate:
  # This method of defining external secrets is deprecated and might be removed in future versions.
  # Use global.apiKey.fromSecret and global.clusterAgentAuthToken.fromSecret instead

  # stackstate.manageOwnSecrets -- Set to true if you don't want this helm chart to create secrets for you.
  manageOwnSecrets: false
  # stackstate.customSecretName -- Name of the secret containing the receiver API key.
  customSecretName: ""
  # stackstate.customApiKeySecretKey -- Key in the secret containing the receiver API key.
  customApiKeySecretKey: "sts-api-key"
  # stackstate.customClusterAuthTokenSecretKey -- Key in the secret containing the cluster auth token.
  customClusterAuthTokenSecretKey: "sts-cluster-auth-token"

  # stackstate.apiKey -- (string) **PROVIDE YOUR API KEY HERE** API key to be used by the agent.
  apiKey:
  cluster:
    # stackstate.cluster.name -- (string) **PROVIDE KUBERNETES CLUSTER NAME HERE** Name of the Kubernetes cluster where the agent will be installed.
    name:
    # stackstate.cluster.authToken -- Provide a token to enable secure communication between the agent and the cluster agent.
    authToken: ""
  # stackstate.url -- (string) **PROVIDE STACKSTATE URL HERE** URL of the StackState installation to receive data from the agent.
  url:
all:
  image:
    # all.image.registry -- The image registry to use.
    registry:
  fullPrivilegesMode:
    # all.fullPrivilegesMode.enabled -- All agent pods run in full privileges mode (mainly used for debugging).
    enabled: false

nodeAgent:
  # nodeAgent.autoScalingEnabled -- Enable / disable autoscaling for the node agent pods.
  autoScalingEnabled: false
  containerRuntime:
    # nodeAgent.containerRuntime.customSocketPath -- If the container socket path does not match the default for CRI-O, Containerd or Docker, supply a custom socket path.
    customSocketPath: ""
    # nodeAgent.containerRuntime.customHostProc -- If the container is launched from a place where /proc is mounted differently, /proc can be changed
    hostProc: /proc

  scc:
    # nodeAgent.scc.enabled -- Enable / disable the installation of the SecurityContextConfiguration needed for installation on OpenShift.
    enabled: false
  protocolInspection:
    # nodeAgent.protocolInspection.enabled -- Enable / disable the nodeAgent protocol inspection.
    enabled: true
  httpTracing:
    # nodeAgent.httpTracing.enabled -- Enable / disable the process-agent HTTP tracing.
    enabled: true
  # nodeAgent.skipSslValidation -- Set to true if self signed certificates are used.
  skipSslValidation: false
  # nodeAgent.skipKubeletTLSVerify -- Set to true if you want to skip kubelet tls verification.
  skipKubeletTLSVerify: false
  # nodeAgent.useHostNetwork -- Set to true if you want to deploy the node agent in the host network namespace.
  useHostNetwork: true
  # nodeAgent.useHostPID -- Set to true if you want to deploy the node agent in the host PID namespace.
  useHostPID: true
  # nodeAgent.checksTagCardinality -- low, orchestrator or high. Orchestrator level adds pod_name, high adds display_container_name
  checksTagCardinality: orchestrator

  # nodeAgent.config --
  config:
    # nodeAgent.config.override -- A list of objects containing three keys `name`, `path` and `data`, specifying filenames at specific paths which need to be (potentially) overridden using a mounted configmap
    override: []

  # nodeAgent.priorityClassName -- Priority class for nodeAgent pods.
  priorityClassName: ""

  scaling:
    autoscalerLimits:
      agent:
        minimum:
          # nodeAgent.scaling.autoscalerLimits.agent.minimum.cpu -- Minimum CPU resource limits for main agent.
          cpu: "20m"
          # nodeAgent.scaling.autoscalerLimits.agent.minimum.memory -- Minimum memory resource limits for main agent.
          memory: "180Mi"
        maximum:
          # nodeAgent.scaling.autoscalerLimits.agent.maximum.cpu -- Maximum CPU resource limits for main agent.
          cpu: "200m"
          # nodeAgent.scaling.autoscalerLimits.agent.maximum.memory -- Maximum memory resource limits for main agent.
          memory: "450Mi"
      processAgent:
        minimum:
          # nodeAgent.scaling.autoscalerLimits.processAgent.minimum.cpu -- Minimum CPU resource limits for process agent.
          cpu: "25m"
          # nodeAgent.scaling.autoscalerLimits.processAgent.minimum.memory -- Minimum memory resource limits for process agent.
          memory: "100Mi"
        maximum:
          # nodeAgent.scaling.autoscalerLimits.processAgent.maximum.cpu -- Maximum CPU resource limits for process agent.
          cpu: "200m"
          # nodeAgent.scaling.autoscalerLimits.processAgent.maximum.memory -- Maximum memory resource limits for process agent.
          memory: "500Mi"

  containers:
    agent:
      image:
        # nodeAgent.containers.agent.image.repository -- Base container image repository.
        repository: stackstate/stackstate-k8s-agent
        # nodeAgent.containers.agent.image.tag -- Default container image tag.
        tag: "239ee985"
        # nodeAgent.containers.agent.image.pullPolicy -- Default container image pull policy.
        pullPolicy: IfNotPresent
      # nodeAgent.containers.agent.env -- Additional environment variables for the agent container
      env: {}
      # nodeAgent.containers.agent.logLevel -- Set logging verbosity, valid log levels are: trace, debug, info, warn, error, critical, and off
      ## If not set, fall back to the value of agent.logLevel.
      logLevel:
      resources:
        limits:
          # nodeAgent.containers.agent.resources.limits.cpu -- CPU resource limits.
          cpu: "270m"
          # nodeAgent.containers.agent.resources.limits.memory -- Memory resource limits.
          memory: "420Mi"
        requests:
          # nodeAgent.containers.agent.resources.requests.cpu -- CPU resource requests.
          cpu: "20m"
          # nodeAgent.containers.agent.resources.requests.memory -- Memory resource requests.
          memory: "180Mi"
      livenessProbe:
        # nodeAgent.containers.agent.livenessProbe.enabled -- Enable use of livenessProbe check.
        enabled: true
        # nodeAgent.containers.agent.livenessProbe.failureThreshold -- `failureThreshold` for the liveness probe.
        failureThreshold: 3
        # nodeAgent.containers.agent.livenessProbe.initialDelaySeconds -- `initialDelaySeconds` for the liveness probe.
        initialDelaySeconds: 15
        # nodeAgent.containers.agent.livenessProbe.periodSeconds -- `periodSeconds` for the liveness probe.
        periodSeconds: 15
        # nodeAgent.containers.agent.livenessProbe.successThreshold -- `successThreshold` for the liveness probe.
        successThreshold: 1
        # nodeAgent.containers.agent.livenessProbe.timeoutSeconds -- `timeoutSeconds` for the liveness probe.
        timeoutSeconds: 5
      readinessProbe:
        # nodeAgent.containers.agent.readinessProbe.enabled -- Enable use of readinessProbe check.
        enabled: true
        # nodeAgent.containers.agent.readinessProbe.failureThreshold -- `failureThreshold` for the readiness probe.
        failureThreshold: 3
        # nodeAgent.containers.agent.readinessProbe.initialDelaySeconds -- `initialDelaySeconds` for the readiness probe.
        initialDelaySeconds: 15
        # nodeAgent.containers.agent.readinessProbe.periodSeconds -- `periodSeconds` for the readiness probe.
        periodSeconds: 15
        # nodeAgent.containers.agent.readinessProbe.successThreshold -- `successThreshold` for the readiness probe.
        successThreshold: 1
        # nodeAgent.containers.agent.readinessProbe.timeoutSeconds -- `timeoutSeconds` for the readiness probe.
        timeoutSeconds: 5

    processAgent:
      # nodeAgent.containers.processAgent.enabled -- Enable / disable the process agent container.
      enabled: true
      image:
        # Override to pull the image from an alternate registry
        registry:
        # nodeAgent.containers.processAgent.image.repository -- Process-agent container image repository.
        repository: stackstate/stackstate-k8s-process-agent
        # nodeAgent.containers.processAgent.image.tag -- Default process-agent container image tag.
        tag: "b9f7fe00"
        # nodeAgent.containers.processAgent.image.pullPolicy -- Process-agent container image pull policy.
        pullPolicy: IfNotPresent
      # nodeAgent.containers.processAgent.env -- Additional environment variables for the process-agent container
      env: {}
      # nodeAgent.containers.processAgent.logLevel -- Set logging verbosity, valid log levels are: trace, debug, info, warn, error, critical, and off
      ## If not set, fall back to the value of agent.logLevel.
      logLevel:
      # nodeAgent.containers.processAgent.procVolumeReadOnly -- Configure whether /host/proc is read only for the process agent container
      procVolumeReadOnly: true

      resources:
        limits:
          # nodeAgent.containers.processAgent.resources.limits.cpu -- CPU resource limits.
          cpu: "125m"
          # nodeAgent.containers.processAgent.resources.limits.memory -- Memory resource limits.
          memory: "400Mi"
        requests:
          # nodeAgent.containers.processAgent.resources.requests.cpu -- CPU resource requests.
          cpu: "25m"
          # nodeAgent.containers.processAgent.resources.requests.memory -- Memory resource requests.
          memory: "128Mi"
  # nodeAgent.service -- The Kubernetes service for the agent
  service:
    # nodeAgent.service.type -- Type of Kubernetes service: ClusterIP, LoadBalancer, NodePort
    type: ClusterIP
    # nodeAgent.service.annotations -- Annotations for the service
    annotations: {}
    # nodeAgent.service.loadBalancerSourceRanges -- The IP4 CIDR allowed to reach LoadBalancer for the service. For LoadBalancer type of service only.
    loadBalancerSourceRanges: ["10.0.0.0/8"]

  # nodeAgent.logLevel -- Logging level for agent processes.
  logLevel: INFO

  # nodeAgent.updateStrategy -- The update strategy for the DaemonSet object.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100

  # nodeAgent.nodeSelector -- Node labels for pod assignment.
  nodeSelector: {}

  # nodeAgent.tolerations -- Toleration labels for pod assignment.
  tolerations: []

  # nodeAgent.affinity -- Affinity settings for pod assignment.
  affinity: {}

  serviceaccount:
    # nodeAgent.serviceaccount.annotations -- Annotations for the service account for the agent daemonset pods
    annotations: {}

processAgent:
  softMemoryLimit:
    # processAgent.softMemoryLimit.goMemLimit -- Soft-limit for golang heap allocation, for sanity, must be around 85% of nodeAgent.containers.processAgent.resources.limits.cpu.
    goMemLimit: 340MiB
    # processAgent.softMemoryLimit.httpStatsBufferSize -- Sets a maximum for the number of http stats to keep in memory between check runs, to use 40k requires around ~400Mib of memory.
    httpStatsBufferSize: 40000
    # processAgent.softMemoryLimit.httpObservationsBufferSize -- Sets a maximum for the number of http observations to keep in memory between check runs, to use 40k requires around ~400Mib of memory.
    httpObservationsBufferSize: 40000

  checkIntervals:
    # processAgent.checkIntervals.connections -- Override the default value of the connections check interval in seconds.
    connections: 30
    # processAgent.checkIntervals.process -- Override the default value of the process check interval in seconds.
    process: 32

  podCorrelation:
    # processAgent.podCorrelation.enabled -- [Experimental] Enable / disable pod correlation.
    enabled: false
    # processAgent.podCorrelation.remoteCache -- When true, the chart will deploy a remote kube cache service and
    # populate the process-agent environment with the service address (serviceName.namespace:grpcPort).
    # Set to `false` to use a local informer inside the process-agent and avoid deploying the remote cache.
    remoteCache: false
    # processAgent.podCorrelation.protocolMetrics -- Enable / disable exporting protocol metrics. If false the agent will export only metrics for network connections.
    protocolMetrics: false
    # processAgent.podCorrelation.partialCorrelation -- Enable / disable partial pod correlation. if false the agent will export only pod<->pod metrics. Both extremities of the connection must be pods.
    partialCorrelation: false
    # processAgent.podCorrelation.attributes -- The attributes to be added to all exported metrics. If nothing is provided a default set will be used.
    attributes: []

    exporter:
      # processAgent.podCorrelation.exporter.type -- The type of the exporter to use for metrics. Possible values ("otlp", "stdout")
      type: ""
      # processAgent.podCorrelation.exporter.endpoint -- Override the default endpoint to which the exporter will send metrics (e.g. "otel-collector-service:4317").
      endpoint: ""
      # processAgent.podCorrelation.exporter.interval -- The interval at which the exporter will send metrics (in seconds).
      interval: 30

  # processAgent.disabledProtocols -- List of protocols to disable for protocol inspection. Supported protocols are http, http2, mongo, amqp, postgres, tls. If nothing is provided all protocols will be enabled.
  disabledProtocols: []

remoteKubeCache:
  # remoteKubeCache.nodeSelector -- Node labels for pod assignment.
  nodeSelector: {}

  # remoteKubeCache.tolerations -- Toleration labels for pod assignment.
  tolerations: []

  # remoteKubeCache.affinity -- Affinity settings for pod assignment.
  affinity: {}

  resources:
    limits:
      # remoteKubeCache.resources.limits.cpu -- CPU resource limits.
      cpu: "200m"
      # remoteKubeCache.resources.limits.memory -- Memory resource limits.
      memory: "400Mi"
    requests:
      # remoteKubeCache.resources.requests.cpu -- CPU resource requests.
      cpu: "100m"
      # remoteKubeCache.resources.requests.memory -- Memory resource requests.
      memory: "200Mi"

clusterAgent:
  collection:
    # clusterAgent.collection.kubernetesEvents -- Enable / disable the cluster agent events collection.
    kubernetesEvents: true
    # clusterAgent.collection.kubernetesMetrics -- Enable / disable the cluster agent metrics collection.
    kubernetesMetrics: true
    # clusterAgent.collection.kubernetesTimeout -- Default timeout (in seconds) when obtaining information from the Kubernetes API.
    kubernetesTimeout: 10
    # clusterAgent.collection.kubernetesTopology -- Enable / disable the cluster agent topology collection.
    kubernetesTopology: true
    kubeStateMetrics:
      # clusterAgent.collection.kubeStateMetrics.enabled -- Enable / disable the cluster agent kube-state-metrics collection.
      enabled: true
      # clusterAgent.collection.kubeStateMetrics.clusterCheck -- For large clusters where the Kubernetes State Metrics Check Core needs to be distributed on dedicated workers.
      clusterCheck: false
      # clusterAgent.collection.kubeStateMetrics.labelsAsTags -- Extra labels to collect from resources and to turn into StackState tag.
      ## It has the following structure:
      ## labelsAsTags:
      ##   <resource1>:        # can be pod, deployment, node, etc.
      ##     <label1>: <tag1>  # where <label1> is the kubernetes label and <tag1> is the StackState tag
      ##     <label2>: <tag2>
      ##   <resource2>:
      ##     <label3>: <tag3>
      ##
      ## Warning: the label must match the transformation done by kube-state-metrics,
      ## for example tags.example/version becomes tags_example_version.
      labelsAsTags: {}
      #  pod:
      #    app: app
      #  node:
      #    zone: zone
      #    team: team

      # clusterAgent.collection.kubeStateMetrics.annotationsAsTags -- Extra annotations to collect from resources and to turn into tags.

      ## It has the following structure:
      ## annotationsAsTags:
      ##   <resource1>:        # can be pod, deployment, node, etc.
      ##     <annotation1>: <tag1>  # where <annotation1> is the kubernetes annotation and <tag1> is the StackState tag
      ##     <annotation2>: <tag2>
      ##   <resource2>:
      ##     <annotation3>: <tag3>
      ##
      ## Warning: the annotation must match the transformation done by kube-state-metrics,
      ## for example tags.example/version becomes tags_example_version.
      annotationsAsTags: {}
    kubernetesResources:
      # clusterAgent.collection.kubernetesResources.limitranges -- Enable / disable collection of LimitRanges.
      limitranges: true
      # clusterAgent.collection.kubernetesResources.horizontalpodautoscalers -- Enable / disable collection of HorizontalPodAutoscalers.
      horizontalpodautoscalers: true
      # clusterAgent.collection.kubernetesResources.replicationcontrollers -- Enable / disable collection of ReplicationControllers.
      replicationcontrollers: true
      # clusterAgent.collection.kubernetesResources.poddisruptionbudgets -- Enable / disable collection of PodDisruptionBudgets.
      poddisruptionbudgets: true
      # clusterAgent.collection.kubernetesResources.storageclasses -- Enable / disable collection of StorageClasses.
      storageclasses: true
      # clusterAgent.collection.kubernetesResources.volumeattachments -- Enable / disable collection of Volume Attachments. Used to bind Nodes to Persistent Volumes.
      volumeattachments: true
      # clusterAgent.collection.kubernetesResources.namespaces -- Enable / disable collection of Namespaces.
      namespaces: true
      # clusterAgent.collection.kubernetesResources.configmaps -- Enable / disable collection of ConfigMaps.
      configmaps: true
      # clusterAgent.collection.kubernetesResources.endpoints -- Enable / disable collection of Endpoints. If endpoints are disabled it is not possible to connect a Service to Pods that serving it
      endpoints: true
      # clusterAgent.collection.kubernetesResources.persistentvolumes -- Enable / disable collection of PersistentVolumes.
      persistentvolumes: true
      # clusterAgent.collection.kubernetesResources.persistentvolumeclaims -- Enable / disable collection of PersistentVolumeClaims. Disabling these makes it impossible to create relations between PersistentVolumes and pods
      persistentvolumeclaims: true
      # clusterAgent.collection.kubernetesResources.secrets -- Enable / disable collection of Secrets.
      secrets: true
      # clusterAgent.collection.kubernetesResources.daemonsets -- Enable / disable collection of DaemonSets.
      daemonsets: true
      # clusterAgent.collection.kubernetesResources.deployments -- Enable / disable collection of Deployments.
      deployments: true
      # clusterAgent.collection.kubernetesResources.replicasets -- Enable / disable collection of ReplicaSets.
      replicasets: true
      # clusterAgent.collection.kubernetesResources.statefulsets -- Enable / disable collection of StatefulSets.
      statefulsets: true
      # clusterAgent.collection.kubernetesResources.ingresses -- Enable / disable collection of Ingresses.
      ingresses: true
      # clusterAgent.collection.kubernetesResources.cronjobs -- Enable / disable collection of CronJobs.
      cronjobs: true
      # clusterAgent.collection.kubernetesResources.jobs -- Enable / disable collection of Jobs.
      jobs: true
      # clusterAgent.collection.kubernetesResources.resourcequotas -- Enable / disable collection of ResourceQuotas.
      resourcequotas: true

  # clusterAgent.config --
  config:
    events:
      # clusterAgent.config.events.categories -- Custom mapping from Kubernetes event reason to StackState event category. Categories allowed: Alerts, Activities, Changes, Others
      categories: {}
    topology:
      # clusterAgent.config.topology.collectionInterval -- Interval for running topology collection, in seconds
      collectionInterval: 90
    configMap:
      # clusterAgent.config.configMap.maxDataSize -- Maximum amount of characters for the data property of a ConfigMap collected by the kubernetes topology check
      maxDataSize:
    # clusterAgent.config.override -- A list of objects containing three keys `name`, `path` and `data`, specifying filenames at specific paths which need to be (potentially) overridden using a mounted configmap
    override: []

  service:
    # clusterAgent.service.port -- Change the Cluster Agent service port
    port: 5005
    # clusterAgent.service.targetPort -- Change the Cluster Agent service targetPort
    targetPort: 5005

  # clusterAgent.enabled -- Enable / disable the cluster agent.
  enabled: true

  # clusterAgent.skipSslValidation -- If true, ignores the server certificate being signed by an unknown authority.
  skipSslValidation: false

  image:
    # clusterAgent.image.repository -- Base container image repository.
    repository: stackstate/stackstate-k8s-cluster-agent
    # clusterAgent.image.tag -- Default container image tag.
    tag: "239ee985"
    # clusterAgent.image.pullPolicy -- Default container image pull policy.
    pullPolicy: IfNotPresent

  livenessProbe:
    # clusterAgent.livenessProbe.enabled -- Enable use of livenessProbe check.
    enabled: true
    # clusterAgent.livenessProbe.failureThreshold -- `failureThreshold` for the liveness probe.
    failureThreshold: 3
    # clusterAgent.livenessProbe.initialDelaySeconds -- `initialDelaySeconds` for the liveness probe.
    initialDelaySeconds: 15
    # clusterAgent.livenessProbe.periodSeconds -- `periodSeconds` for the liveness probe.
    periodSeconds: 15
    # clusterAgent.livenessProbe.successThreshold -- `successThreshold` for the liveness probe.
    successThreshold: 1
    # clusterAgent.livenessProbe.timeoutSeconds -- `timeoutSeconds` for the liveness probe.
    timeoutSeconds: 5

  # clusterAgent.logLevel -- Logging level for stackstate-k8s-agent processes.
  logLevel: INFO

  # clusterAgent.priorityClassName -- Priority class for stackstate-k8s-agent pods.
  priorityClassName: ""

  readinessProbe:
    # clusterAgent.readinessProbe.enabled -- Enable use of readinessProbe check.
    enabled: true
    # clusterAgent.readinessProbe.failureThreshold -- `failureThreshold` for the readiness probe.
    failureThreshold: 3
    # clusterAgent.readinessProbe.initialDelaySeconds -- `initialDelaySeconds` for the readiness probe.
    initialDelaySeconds: 15
    # clusterAgent.readinessProbe.periodSeconds -- `periodSeconds` for the readiness probe.
    periodSeconds: 15
    # clusterAgent.readinessProbe.successThreshold -- `successThreshold` for the readiness probe.
    successThreshold: 1
    # clusterAgent.readinessProbe.timeoutSeconds -- `timeoutSeconds` for the readiness probe.
    timeoutSeconds: 5

  # clusterAgent.replicaCount -- Number of replicas of the cluster agent to deploy.
  replicaCount: 1

  serviceaccount:
    # clusterAgent.serviceaccount.annotations -- Annotations for the service account for the cluster agent pods
    annotations: {}

  # clusterAgent.strategy -- The strategy for the Deployment object.
  strategy:
    type: RollingUpdate
    # rollingUpdate:
    #   maxUnavailable: 1

  resources:
    limits:
      # clusterAgent.resources.limits.cpu -- CPU resource limits.
      cpu: "400m"
      # clusterAgent.resources.limits.memory -- Memory resource limits.
      memory: "800Mi"
    requests:
      # clusterAgent.resources.requests.cpu -- CPU resource requests.
      cpu: "70m"
      # clusterAgent.resources.requests.memory -- Memory resource requests.
      memory: "512Mi"

  # clusterAgent.nodeSelector -- Node labels for pod assignment.
  nodeSelector: {}

  # clusterAgent.tolerations -- Toleration labels for pod assignment.
  tolerations: []

  # clusterAgent.affinity -- Affinity settings for pod assignment.
  affinity: {}

openShiftLogging:
  # openShiftLogging.installSecret -- Install a secret for logging on openshift
  installSecret: false

logsAgent:
  # logsAgent.enabled -- Enable / disable k8s pod log collection
  enabled: true

  # logsAgent.skipSslValidation -- If true, ignores the server certificate being signed by an unknown authority.
  skipSslValidation: false

  # logsAgent.priorityClassName -- Priority class for logsAgent pods.
  priorityClassName: ""

  image:
    # logsAgent.image.repository -- Base container image repository.
    repository: stackstate/promtail
    # logsAgent.image.tag -- Default container image tag.
    tag: "3.6.11-so10"
    # logsAgent.image.pullPolicy -- Default container image pull policy.
    pullPolicy: IfNotPresent

  resources:
    limits:
      # logsAgent.resources.limits.cpu -- CPU resource limits.
      cpu: "1300m"
      # logsAgent.resources.limits.memory -- Memory resource limits.
      memory: "192Mi"
    requests:
      # logsAgent.resources.requests.cpu -- CPU resource requests.
      cpu: "20m"
      # logsAgent.resources.requests.memory -- Memory resource requests.
      memory: "100Mi"

  # logsAgent.updateStrategy -- The update strategy for the DaemonSet object.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100

  # logsAgent.nodeSelector -- Node labels for pod assignment.
  nodeSelector: {}

  # logsAgent.tolerations -- Toleration labels for pod assignment.
  tolerations: []

  # logsAgent.affinity -- Affinity settings for pod assignment.
  affinity: {}

  serviceaccount:
    # logsAgent.serviceaccount.annotations -- Annotations for the service account for the daemonset pods
    annotations: {}

checksAgent:
  # checksAgent.enabled -- Enable / disable runnning cluster checks in a separately deployed pod
  enabled: true
  # checksAgent.skipSslValidation -- Set to true if self signed certificates are used.
  skipSslValidation: false

  # checksAgent.checksTagCardinality -- low, orchestrator or high. Orchestrator level adds pod_name, high adds display_container_name
  checksTagCardinality: orchestrator

  # checksAgent.config --
  config:
    # checksAgent.config.override -- A list of objects containing three keys `name`, `path` and `data`, specifying filenames at specific paths which need to be (potentially) overridden using a mounted configmap
    override: []

  image:
    # checksAgent.image.repository -- Base container image repository.
    repository: stackstate/stackstate-k8s-agent
    # checksAgent.image.tag -- Default container image tag.
    tag: "239ee985"
    # checksAgent.image.pullPolicy -- Default container image pull policy.
    pullPolicy: IfNotPresent

  livenessProbe:
    # checksAgent.livenessProbe.enabled -- Enable use of livenessProbe check.
    enabled: true
    # checksAgent.livenessProbe.failureThreshold -- `failureThreshold` for the liveness probe.
    failureThreshold: 3
    # checksAgent.livenessProbe.initialDelaySeconds -- `initialDelaySeconds` for the liveness probe.
    initialDelaySeconds: 15
    # checksAgent.livenessProbe.periodSeconds -- `periodSeconds` for the liveness probe.
    periodSeconds: 15
    # checksAgent.livenessProbe.successThreshold -- `successThreshold` for the liveness probe.
    successThreshold: 1
    # checksAgent.livenessProbe.timeoutSeconds -- `timeoutSeconds` for the liveness probe.
    timeoutSeconds: 5

  # checksAgent.logLevel -- Logging level for clusterchecks agent processes.
  logLevel: INFO

  # checksAgent.priorityClassName -- Priority class for clusterchecks agent pods.
  priorityClassName: ""

  readinessProbe:
    # checksAgent.readinessProbe.enabled -- Enable use of readinessProbe check.
    enabled: true
    # checksAgent.readinessProbe.failureThreshold -- `failureThreshold` for the readiness probe.
    failureThreshold: 3
    # checksAgent.readinessProbe.initialDelaySeconds -- `initialDelaySeconds` for the readiness probe.
    initialDelaySeconds: 15
    # checksAgent.readinessProbe.periodSeconds -- `periodSeconds` for the readiness probe.
    periodSeconds: 15
    # checksAgent.readinessProbe.successThreshold -- `successThreshold` for the readiness probe.
    successThreshold: 1
    # checksAgent.readinessProbe.timeoutSeconds -- `timeoutSeconds` for the readiness probe.
    timeoutSeconds: 5

  # checksAgent.replicas -- Number of clusterchecks agent pods to schedule
  replicas: 1

  resources:
    limits:
      # checksAgent.resources.limits.cpu -- CPU resource limits.
      cpu: "400m"
      # checksAgent.resources.limits.memory -- Memory resource limits.
      memory: "600Mi"
    requests:
      # checksAgent.resources.requests.cpu -- CPU resource requests.
      cpu: "20m"
      # checksAgent.resources.requests.memory -- Memory resource requests.
      memory: "512Mi"

  serviceaccount:
    # checksAgent.serviceaccount.annotations -- Annotations for the service account for the cluster checks pods
    annotations: {}

  # checksAgent.strategy -- The strategy for the Deployment object.
  strategy:
    type: RollingUpdate
    # rollingUpdate:
    #   maxUnavailable: 1

  # checksAgent.nodeSelector -- Node labels for pod assignment.
  nodeSelector: {}

  # checksAgent.tolerations -- Toleration labels for pod assignment.
  tolerations: []

  # checksAgent.affinity -- Affinity settings for pod assignment.
  affinity: {}

###############################################################
# OTel Prometheus scraping + K8s resource collector variables #
###############################################################

otel:
  # otel.platformHttpOtlpEndpoint -- Override the OTLP endpoint with an HTTP(S) OTLP endpoint (format must be `http(s)://<host>:<port>`), takes precedence over the platformGrpcOtlpEndpoint when both overrides are defined. When empty, derived by appending /otel to stackstate.url.
  platformHttpOtlpEndpoint: ""
  # otel.platformGrpcOtlpEndpoint -- Override the OTLP endpoint with a gRPC OTLP endpoint (format must be `host:port`, no scheme) platformHttpOtlpEndpoint takes precedence when both overrides are defined. When empty, derived by appending /otel to stackstate.url.
  platformGrpcOtlpEndpoint: ""

  # otel.enabled -- Master switch for all OTel components. Set to true to activate OpenTelemetry based features.
  enabled: false

  ###############################
  # K8s resource collector variables #
  ###############################

  k8sResourceCollector:
    # otel.k8sResourceCollector.enabled -- Enable / disable the OpenTelemetry cluster collector for CRD discovery. Requires otel.enabled=true.
    enabled: true

    # otel.k8sResourceCollector.skipSslValidation -- If true, ignores the server certificate being signed by an unknown authority.
    skipSslValidation: false

    image:
      # otel.k8sResourceCollector.image.repository -- Base container image repository.
      repository: stackstate/sts-opentelemetry-collector
      # otel.k8sResourceCollector.image.tag -- Container image tag for 'opentelemetry-collector' containers.
      tag: "v0.0.52-agent"
      # otel.k8sResourceCollector.image.pullPolicy -- Default container image pull policy.
      pullPolicy: IfNotPresent
    pprof:
      # otel.k8sResourceCollector.pprof.enabled -- Enable the pprof extension for profiling/debugging. Opt-out: enabled by default. The pprof endpoint is reachable inside the pod (port 1777) via kubectl port-forward.
      enabled: true
    crDiscovery:
      # otel.k8sResourceCollector.crDiscovery.snapshotInterval -- Interval for periodic snapshot emission from the informer cache (default: 5m, min: 1m)
      snapshotInterval: 5m
      # otel.k8sResourceCollector.crDiscovery.discoveryMode -- CR discovery mode: "api_groups" (filtered custom resources) or "all" (watch all custom resources). CRDs are always watched and forwarded.
      discoveryMode: api_groups
      apiGroups:
        # otel.k8sResourceCollector.crDiscovery.apiGroups.include -- Map of API group patterns (key) -> bool (enabled). Used for both CR filtering and restricted RBAC. Supports wildcards like "*.suse.com" for filtering, but restricted RBAC (rbac.useWildcard=false) can only render exact API groups or "*". Set a key to false in an override values file to disable a default. Must have at least one truthy entry when discoveryMode is "api_groups". Common SUSE integration API groups are added by the enabled integrations below.
        include: {}
        # otel.k8sResourceCollector.crDiscovery.apiGroups.exclude -- Map of API group patterns (key) -> bool (enabled). Empty by default.
        exclude: {}

    dataLimits:
      # otel.k8sResourceCollector.dataLimits.maxCrTotalDataSizeBytes -- Total serialized payload budget, in bytes, for CR-discovered Custom Resources per collection cycle. Default: 10 MiB. CRs are considered smallest-first, then by stable identity; CRs that do not fit are dropped and counted in receiver metrics.
      maxCrTotalDataSizeBytes: 10485760
      # otel.k8sResourceCollector.dataLimits.maxObjectTotalDataSizeBytes -- Total serialized payload budget, in bytes, for statically configured Kubernetes object watches per collection cycle. Default: 10 MiB. Objects are considered smallest-first, then by stable identity; objects that do not fit are dropped and counted in receiver metrics.
      maxObjectTotalDataSizeBytes: 10485760

    rbac:
      # otel.k8sResourceCollector.rbac.useWildcard -- Use wildcard permissions for watching all custom resources. Set to false for restricted RBAC with specific API groups
      useWildcard: true

    integrations:
      # otel.k8sResourceCollector.integrations.suseRuntimeEnforcer -- Enable pre-configured API group filters for the SUSE Runtime Enforcer stackpack.
      suseRuntimeEnforcer: true
      # otel.k8sResourceCollector.integrations.suseAdmissionController -- Enable pre-configured API group filters for the SUSE Admission Controller (Kubewarden) stackpack.
      suseAdmissionController: true
      # otel.k8sResourceCollector.integrations.suseVirtualization -- Enable pre-configured API group filters for the SUSE Virtualization (KubeVirt) stackpack.
      suseVirtualization: true
      # otel.k8sResourceCollector.integrations.suseSbomScanner -- Enable pre-configured API group filters for the SUSE SBOM Scanner stackpack.
      suseSbomScanner: false
      # otel.k8sResourceCollector.integrations.rancher -- Enable Rancher Manager URL enrichment. When true, the collector reads CATTLE_SERVER from the cattle-cluster-agent Deployment in cattle-system and attaches it as a resource attribute on all emitted log records. Defaults to false: on non-Rancher clusters the cattle-system namespace is absent so the necessary Role and RoleBinding cannot be created.
      rancher: false

    # otel.k8sResourceCollector.objects -- Map of resource name (plural, used as the key) -> spec for additional Kubernetes resources to watch alongside CRD-discovered custom resources. Spec fields: group (empty for core), version (preferred if empty), namespaces (cluster-wide if empty), labelSelector, fieldSelector. Set a value to null or false in an override values file to disable a default entry. Entries that overlap a CRD covered by cr_api_groups are rejected at startup. When useWildcard=false, get/list/watch RBAC for each entry is auto-derived (deduped per group).
    objects: {}
    # Example:
    # objects:
    #   pods:
    #     group: ""
    #     namespaces: ["kube-system"]
    #   deployments:
    #     group: apps
    #     labelSelector: "app=foo"

    # otel.k8sResourceCollector.deniedObjects -- Map of resource name (plural, used as the key) -> spec extending the built-in denylist (core Secrets, ConfigMaps). Spec needs only `group`. Resources listed here must not appear under otel.k8sResourceCollector.objects. Use to block third-party resources with sensitive contents.
    deniedObjects: {}
    # Example:
    # deniedObjects:
    #   certificates:
    #     group: cert-manager.io

    peerSync:
      # otel.k8sResourceCollector.peerSync.port -- Port for peer-to-peer cache sync HTTP server. Each replica serves its cache on this port.
      port: 4319

    leaderElection:
      # otel.k8sResourceCollector.leaderElection.enabled -- Enable the k8s_leader_elector extension and peer-to-peer cache sync. When enabled, only the leader actively watches CRDs/CRs, and cache state is synced to replicas for fast failover.
      enabled: true
      # otel.k8sResourceCollector.leaderElection.leaseName -- Name of the Lease object. Must be unique per collector deployment.
      leaseName: "k8sresourcereceiver"
      # otel.k8sResourceCollector.leaderElection.leaseDuration -- Duration a leader holds the lease before it must renew.
      leaseDuration: 15s
      # otel.k8sResourceCollector.leaderElection.renewDeadline -- Deadline for the leader to renew the lease. Must be less than leaseDuration.
      renewDeadline: 10s
      # otel.k8sResourceCollector.leaderElection.retryPeriod -- How often non-leaders retry acquiring the lease. Must be less than renewDeadline.
      retryPeriod: 2s

    livenessProbe:
      # otel.k8sResourceCollector.livenessProbe.enabled -- Enable use of livenessProbe check.
      enabled: true
      # otel.k8sResourceCollector.livenessProbe.failureThreshold -- `failureThreshold` for the liveness probe.
      failureThreshold: 3
      # otel.k8sResourceCollector.livenessProbe.initialDelaySeconds -- `initialDelaySeconds` for the liveness probe.
      initialDelaySeconds: 10
      # otel.k8sResourceCollector.livenessProbe.periodSeconds -- `periodSeconds` for the liveness probe.
      periodSeconds: 10
      # otel.k8sResourceCollector.livenessProbe.successThreshold -- `successThreshold` for the liveness probe.
      successThreshold: 1
      # otel.k8sResourceCollector.livenessProbe.timeoutSeconds -- `timeoutSeconds` for the liveness probe.
      timeoutSeconds: 5

    # otel.k8sResourceCollector.logLevel -- Logging level for OpenTelemetry collector (debug, info, warn, error)
    logLevel: info

    # otel.k8sResourceCollector.priorityClassName -- Priority class for cluster collector pods.
    priorityClassName: ""

    readinessProbe:
      # otel.k8sResourceCollector.readinessProbe.enabled -- Enable use of readinessProbe check.
      enabled: true
      # otel.k8sResourceCollector.readinessProbe.failureThreshold -- `failureThreshold` for the readiness probe.
      failureThreshold: 3
      # otel.k8sResourceCollector.readinessProbe.initialDelaySeconds -- `initialDelaySeconds` for the readiness probe.
      initialDelaySeconds: 5
      # otel.k8sResourceCollector.readinessProbe.periodSeconds -- `periodSeconds` for the readiness probe.
      periodSeconds: 5
      # otel.k8sResourceCollector.readinessProbe.successThreshold -- `successThreshold` for the readiness probe.
      successThreshold: 1
      # otel.k8sResourceCollector.readinessProbe.timeoutSeconds -- `timeoutSeconds` for the readiness probe.
      timeoutSeconds: 5

    # otel.k8sResourceCollector.replicaCount -- Number of cluster collector pods to schedule. Use 2+ with leaderElection for HA.
    replicaCount: 2

    resources:
      limits:
        # otel.k8sResourceCollector.resources.limits.cpu -- CPU resource limits.
        cpu: "500m"
        # otel.k8sResourceCollector.resources.limits.memory -- Memory resource limits.
        memory: "512Mi"
      requests:
        # otel.k8sResourceCollector.resources.requests.cpu -- CPU resource requests.
        cpu: "100m"
        # otel.k8sResourceCollector.resources.requests.memory -- Memory resource requests.
        memory: "128Mi"

    serviceaccount:
      # otel.k8sResourceCollector.serviceaccount.annotations -- Annotations for the service account for the cluster collector pods
      annotations: {}

    # otel.k8sResourceCollector.strategy -- The strategy for the Deployment object.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    # otel.k8sResourceCollector.podAnnotations -- Additional annotations for cluster collector pods.
    podAnnotations: {}

    # otel.k8sResourceCollector.podLabels -- Additional labels for cluster collector pods.
    podLabels: {}

    # otel.k8sResourceCollector.nodeSelector -- Node labels for pod assignment.
    nodeSelector: {}

    # otel.k8sResourceCollector.tolerations -- Toleration labels for pod assignment.
    tolerations: []

    # otel.k8sResourceCollector.affinity -- Affinity settings for pod assignment.
    affinity: {}

    # otel.k8sResourceCollector.debug -- Optional debug exporter for troubleshooting.
    # When enabled, the upstream OTel `debug` exporter is wired into the listed
    # pipelines so payloads are written to the collector log. Leave disabled in
    # production.
    debug:
      # otel.k8sResourceCollector.debug.enabled -- Enable the debug exporter for this collector.
      enabled: false
      # otel.k8sResourceCollector.debug.verbosity -- Debug exporter verbosity: basic, normal, or detailed.
      verbosity: basic
      # otel.k8sResourceCollector.debug.pipelines -- Pipelines (by signal) to attach the debug exporter to. Must be a subset of {traces, logs, metrics}.
      pipelines:
        - logs

  prometheusScraping:
    # otel.prometheusScraping.enabled -- Enable / disable OpenTelemetry Collector based Prometheus scraping via ServiceMonitor and PodMonitor resources. Requires otel.enabled=true.
    enabled: true

    # otel.prometheusScraping.skipSslValidation -- If true, ignores the server certificate being signed by an unknown authority when sending OTLP to the platform.
    skipSslValidation: false

    monitorCrds:
      # otel.prometheusScraping.monitorCrds.enabled -- Install and upgrade ServiceMonitor and PodMonitor CRDs when Prometheus scraping is enabled.
      enabled: false
      # otel.prometheusScraping.monitorCrds.keep -- Annotate the installed ServiceMonitor and PodMonitor CRDs with `helm.sh/resource-policy: keep` so they (and any custom resources users have created against them) survive a `helm uninstall` of this chart. Only takes effect when `monitorCrds.enabled` is true.
      keep: true

    collector:
      image:
        # otel.prometheusScraping.collector.image.repository -- Base container image repository for the Prometheus scraper collector. Shares the SUSE Observability collector image with the k8sResourceCollector component but keeps its own tag/pullPolicy so the two can be overridden independently.
        repository: stackstate/sts-opentelemetry-collector
        # otel.prometheusScraping.collector.image.tag -- Container image tag for the Prometheus scraper collector. Uses the strict agent collector BOM image (the "-agent" suffixed tag).
        tag: "v0.0.52-agent"
        # otel.prometheusScraping.collector.image.pullPolicy -- Container image pull policy for the Prometheus scraper collector.
        pullPolicy: IfNotPresent

      pprof:
        # otel.prometheusScraping.collector.pprof.enabled -- Enable the pprof extension for profiling/debugging. Opt-out: enabled by default. The pprof endpoint is reachable inside the pod (port 1777) via kubectl port-forward.
        enabled: true

      # otel.prometheusScraping.collector.replicaCount -- Number of Prometheus scraper collector pods to schedule.
      replicaCount: 1

      # otel.prometheusScraping.collector.priorityClassName -- Priority class for Prometheus scraper collector pods.
      priorityClassName:
      resources:
        limits:
          # otel.prometheusScraping.collector.resources.limits.cpu -- CPU resource limits.
          cpu: "500m"
          # otel.prometheusScraping.collector.resources.limits.memory -- Memory resource limits. A bit more headroom than k8sResourceCollector to absorb scrape batching from many targets.
          memory: "1Gi"
        requests:
          # otel.prometheusScraping.collector.resources.requests.cpu -- CPU resource requests.
          cpu: "100m"
          # otel.prometheusScraping.collector.resources.requests.memory -- Memory resource requests.
          memory: "256Mi"

      # otel.prometheusScraping.collector.podAnnotations -- Additional annotations for Prometheus scraper collector pods.
      podAnnotations: {}

      # otel.prometheusScraping.collector.podLabels -- Additional labels for Prometheus scraper collector pods.
      podLabels: {}

      # otel.prometheusScraping.collector.nodeSelector -- Node labels for pod assignment.
      nodeSelector: {}

      # otel.prometheusScraping.collector.tolerations -- Toleration labels for pod assignment.
      tolerations: []

      # otel.prometheusScraping.collector.affinity -- Affinity settings for pod assignment.
      affinity: {}

      # otel.prometheusScraping.collector.debug -- Optional debug exporter for troubleshooting.
      # When enabled, the upstream OTel `debug` exporter is wired into the listed
      # pipelines so payloads are written to the collector log. Leave disabled in
      # production.
      debug:
        # otel.prometheusScraping.collector.debug.enabled -- Enable the debug exporter for this collector.
        enabled: false
        # otel.prometheusScraping.collector.debug.verbosity -- Debug exporter verbosity: basic, normal, or detailed.
        verbosity: basic
        # otel.prometheusScraping.collector.debug.pipelines -- Pipelines (by signal) to attach the debug exporter to. Must be a subset of {traces, logs, metrics}.
        pipelines:
          - metrics

    targetAllocator:
      image:
        # otel.prometheusScraping.targetAllocator.image.registry -- Override registry for the Target Allocator image. Defaults to global.imageRegistry.
        registry:
        # otel.prometheusScraping.targetAllocator.image.repository -- SUSE Observability Target Allocator image repository, rebuilt from the OpenTelemetry Operator source on SUSE BCI so we can patch Go-stdlib and golang.org/x/* CVEs without waiting for an upstream operator release.
        repository: stackstate/opentelemetry-target-allocator
        # otel.prometheusScraping.targetAllocator.image.tag -- SUSE Observability Target Allocator image tag (<upstream-version>-so<release-increment>).
        tag: "0.153.0-so6"
        # otel.prometheusScraping.targetAllocator.image.pullPolicy -- Container image pull policy for the Target Allocator.
        pullPolicy: IfNotPresent

      # otel.prometheusScraping.targetAllocator.replicaCount -- Number of Target Allocator pods to schedule.
      replicaCount: 1

      # otel.prometheusScraping.targetAllocator.priorityClassName -- Priority class for Target Allocator pods.
      priorityClassName:
      # otel.prometheusScraping.targetAllocator.allocationStrategy -- Target Allocator strategy for distributing scrape targets across collectors.
      allocationStrategy: consistent-hashing
      # otel.prometheusScraping.targetAllocator.filterStrategy -- Target Allocator filtering strategy for generated scrape configs.
      filterStrategy: relabel-config
      # otel.prometheusScraping.targetAllocator.mtlsEnabled -- Enable mTLS between scraper collectors and the Target Allocator. When true, credentials referenced by ServiceMonitors and PodMonitors are fetched over a mutually authenticated TLS connection. Requires cert-manager to be installed. See the README for details.
      mtlsEnabled: false
      # otel.prometheusScraping.targetAllocator.allowInsecureAuthSecrets -- Allow the Target Allocator to serve ServiceMonitor and PodMonitor auth secrets to collectors over plain HTTP. When false (default), auth secrets are not served; enable mTLS with mtlsEnabled=true to serve them securely, or set to true to allow serving over plain HTTP.
      allowInsecureAuthSecrets: false

      resources:
        limits:
          # otel.prometheusScraping.targetAllocator.resources.limits.cpu -- CPU resource limits. The allocator only watches monitor CRDs and distributes targets across collectors, so this can stay small.
          cpu: "200m"
          # otel.prometheusScraping.targetAllocator.resources.limits.memory -- Memory resource limits.
          memory: "256Mi"
        requests:
          # otel.prometheusScraping.targetAllocator.resources.requests.cpu -- CPU resource requests.
          cpu: "50m"
          # otel.prometheusScraping.targetAllocator.resources.requests.memory -- Memory resource requests.
          memory: "64Mi"

      # otel.prometheusScraping.targetAllocator.podAnnotations -- Additional annotations for Target Allocator pods.
      podAnnotations: {}

      # otel.prometheusScraping.targetAllocator.podLabels -- Additional labels for Target Allocator pods.
      podLabels: {}

      # otel.prometheusScraping.targetAllocator.nodeSelector -- Node labels for pod assignment.
      nodeSelector: {}

      # otel.prometheusScraping.targetAllocator.tolerations -- Toleration labels for pod assignment.
      tolerations: []

      # otel.prometheusScraping.targetAllocator.affinity -- Affinity settings for pod assignment.
      affinity: {}

      prometheusCR:
        # otel.prometheusScraping.targetAllocator.prometheusCR.serviceMonitorSelector -- Labels or full LabelSelector selecting ServiceMonitor resources to scrape.
        serviceMonitorSelector:
          observability.suse.com/agent: scrape
        # otel.prometheusScraping.targetAllocator.prometheusCR.serviceMonitorNamespaceSelector -- Labels or full LabelSelector selecting ServiceMonitor namespaces.
        serviceMonitorNamespaceSelector: {}
        # otel.prometheusScraping.targetAllocator.prometheusCR.podMonitorSelector -- Labels or full LabelSelector selecting PodMonitor resources to scrape.
        podMonitorSelector:
          observability.suse.com/agent: scrape
        # otel.prometheusScraping.targetAllocator.prometheusCR.podMonitorNamespaceSelector -- Labels or full LabelSelector selecting PodMonitor namespaces.
        podMonitorNamespaceSelector: {}
        # otel.prometheusScraping.targetAllocator.prometheusCR.allowNamespaces -- Namespaces where monitor resources are allowed. Mutually exclusive with denyNamespaces.
        allowNamespaces: []
        # otel.prometheusScraping.targetAllocator.prometheusCR.denyNamespaces -- Namespaces where monitor resources are denied. Mutually exclusive with allowNamespaces.
        denyNamespaces: []
        # otel.prometheusScraping.targetAllocator.prometheusCR.secretNamespaces -- Namespaces where referenced monitor auth secrets can be read.
        secretNamespaces: []
        # otel.prometheusScraping.targetAllocator.prometheusCR.denyFSAccessThroughSMs -- Drop monitor endpoints that reference arbitrary files on the collector filesystem.
        denyFSAccessThroughSMs: true

  telemetryGateway:
    # otel.telemetryGateway.enabled -- Enable the telemetry gateway for OTLP push-based
    # telemetry (metrics, traces, logs). Requires otel.enabled=true.
    enabled: false

    # otel.telemetryGateway.skipSslValidation -- Skip TLS validation when exporting to the platform.
    skipSslValidation: false

    image:
      # otel.telemetryGateway.image.repository -- Base container image repository.
      repository: stackstate/sts-opentelemetry-collector
      # otel.telemetryGateway.image.tag -- Container image tag for the telemetry gateway. Uses the strict agent collector BOM image (the "-agent" suffixed tag).
      tag: "v0.0.52-agent"
      # otel.telemetryGateway.image.pullPolicy -- Default container image pull policy.
      pullPolicy: IfNotPresent

    pprof:
      # otel.telemetryGateway.pprof.enabled -- Enable the pprof extension for profiling/debugging. Opt-out: enabled by default. The pprof endpoint is reachable inside the pod (port 1777) via kubectl port-forward.
      enabled: true
    # otel.telemetryGateway.replicaCount -- Number of gateway pods.
    # 1 is sufficient for small/medium clusters. Use 2+ with a PDB for HA.
    replicaCount: 1

    # otel.telemetryGateway.priorityClassName -- Priority class for gateway pods.
    priorityClassName: ""

    resources:
      limits:
        # otel.telemetryGateway.resources.limits.cpu -- CPU resource limits.
        cpu: "500m"
        # otel.telemetryGateway.resources.limits.memory -- Memory resource limits.
        memory: "1Gi"
      requests:
        # otel.telemetryGateway.resources.requests.cpu -- CPU resource requests.
        cpu: "100m"
        # otel.telemetryGateway.resources.requests.memory -- Memory resource requests.
        memory: "512Mi"

    # otel.telemetryGateway.strategy -- The strategy for the Deployment object.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    serviceaccount:
      # otel.telemetryGateway.serviceaccount.annotations -- Annotations for the service account for the gateway pods.
      annotations: {}

    service:
      # otel.telemetryGateway.service.annotations -- Annotations for the ClusterIP Service.
      annotations: {}

    spanMetrics:
      # otel.telemetryGateway.spanMetrics.aggregationCardinalityLimit -- Maximum number of unique span-metric aggregation series held by the gateway. Prevents high-cardinality spans from exhausting memory.
      aggregationCardinalityLimit: 5000

    traceSampling:
      # otel.telemetryGateway.traceSampling.maxTotalSpansPerSecond -- Maximum traces spans per second exported by the gateway.
      maxTotalSpansPerSecond: 500

    # otel.telemetryGateway.podAnnotations -- Additional annotations for gateway pods.
    podAnnotations: {}

    # otel.telemetryGateway.podLabels -- Additional labels for gateway pods.
    podLabels: {}

    # otel.telemetryGateway.nodeSelector -- Node labels for pod assignment.
    nodeSelector: {}

    # otel.telemetryGateway.tolerations -- Toleration labels for pod assignment.
    tolerations: []

    # otel.telemetryGateway.affinity -- Affinity settings for pod assignment.
    affinity: {}

    # otel.telemetryGateway.debug -- Optional debug exporter for troubleshooting.
    # When enabled, the upstream OTel `debug` exporter is wired into the listed
    # pipelines so payloads are written to the collector log. Leave disabled in
    # production.
    debug:
      # otel.telemetryGateway.debug.enabled -- Enable the debug exporter for this collector.
      enabled: false
      # otel.telemetryGateway.debug.verbosity -- Debug exporter verbosity: basic, normal, or detailed.
      verbosity: basic
      # otel.telemetryGateway.debug.pipelines -- Pipelines (by signal) to attach the debug exporter to. Must be a subset of {traces, logs, metrics}.
      pipelines:
        - traces
        - logs
        - metrics

##################################
# http-header-injector variables #
##################################

httpHeaderInjectorWebhook:
  # httpHeaderInjectorWebhook.enabled -- Enable the webhook for injection http header injection sidecar proxy
  enabled: false

  # proxy -- Proxy being injected into pods for rewriting http headers
  proxy:
    image:
      # proxy.image.repository - Repository for the docker image
      repository: "stackstate/http-header-injector-proxy"
      # proxy.image.tag - Tag for the docker image
      tag: "1.38.3-so2"

  # proxyInit -- InitContainer within pod which redirects traffic to the proxy container.
  proxyInit:
    image:
      # proxyInit.image.repository - Repository for the docker image
      repository: "stackstate/http-header-injector-proxy-init"
      # proxyInit.image.tag - Tag for the docker image
      tag: "1.0.0-so4"

  # sidecarInjector -- Service for injecting the proxy sidecar into pods
  sidecarInjector:
    image:
      # sidecarInjector.image.repository - Repository for the docker image
      repository: "stackstate/generic-sidecar-injector"
      # sidecarInjector.image.tag - Tag for the docker image
      tag: "b8ac81b7-1024-release"

  # certificatePrehook -- Helm prehook to setup/remove a certificate for the sidecarInjector mutationwebhook
  certificatePrehook:
    image:
      # certificatePrehook.image.repository - Repository for the docker image.
      repository: stackstate/container-tools
      # certificatePrehook.image.tag
      tag: "1.8.6-so16"

########################
# Rbac Agent variables #
########################

kubernetes-rbac-agent:
  # kubernetes-rbac-agent.enabled. Enables/disables the rbac agent.
  enabled: true
  url:
    fromConfigMap: '{{ include "stackstate-k8s-agent.url.configmap.internal.name" . }}'

  clusterName:
    fromConfigMap: '{{ include "stackstate-k8s-agent.clusterName.configmap.internal.name" . }}'

  roleType: 'scope'
  containers:
    rbacAgent:
      image:
        # kubernetes-rbac-agent.containers.rbacAgent.image.registry -- Registry for the docker image.
        # registry:
        # kubernetes-rbac-agent.containers.rbacAgent.image.repository - Repository for the docker image
        repository: "stackstate/kubernetes-rbac-agent"
