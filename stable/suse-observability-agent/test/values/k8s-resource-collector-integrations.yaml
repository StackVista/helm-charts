stackstate:
  apiKey: test-api-key
  cluster:
    name: test-cluster
  url: https://my-suse-observability-instance.com/receiver

# All four integration flags enabled. Exercises the mergedValues helper:
# integration groups are merged into the include map without requiring a wildcard.
otel:
  enabled: true
  k8sResourceCollector:
    enabled: true
    crDiscovery:
      discoveryMode: api_groups
    rbac:
      useWildcard: true
    integrations:
      suseRuntimeEnforcer: true
      suseAdmissionController: true
      suseVirtualization: true
      suseSbomScanner: true
