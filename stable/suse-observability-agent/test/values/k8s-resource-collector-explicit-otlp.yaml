stackstate:
  apiKey: test-api-key
  cluster:
    name: test-cluster
  url: https://my-suse-observability-instance.com/receiver

# Enable cluster collector with explicit HTTP OTLP endpoint override
otel:
  enabled: true
  k8sResourceCollector:
    enabled: true
    crDiscovery:
      interval: 15m
      discoveryMode: all
    rbac:
      useWildcard: true

  platformHttpOtlpEndpoint: "https://custom-otlp.example.com:4318"
