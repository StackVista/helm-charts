stackstate:
  apiKey: test-api-key
  cluster:
    name: test-cluster
  url: https://my-suse-observability-instance.com

# Enable cluster collector with gRPC protocol via dedicated OTLP ingress.
otel:
  enabled: true
  k8sResourceCollector:
    enabled: true
    crDiscovery:
      interval: 15m
      discoveryMode: api_groups
      apiGroups:
        include:
          "*": true
        exclude: {}
    rbac:
      useWildcard: true

  platformGrpcOtlpEndpoint: "otlp-my-suse-observability-instance.com:443"
