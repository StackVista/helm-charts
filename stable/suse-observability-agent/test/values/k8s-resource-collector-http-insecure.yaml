stackstate:
  apiKey: test-api-key
  cluster:
    name: test-cluster
  url: https://my-suse-observability-instance.com

# Enable cluster collector with a plain http:// OTLP endpoint (no TLS).
k8sResourceCollector:
  enabled: true
  crdDiscovery:
    interval: 15m
    discoveryMode: all
  rbac:
    useWildcard: true

otel:
  platformHttpOtlpEndpoint: "http://otlp-my-instance.example.com:4318"
