stackstate:
  apiKey: test-api-key
  cluster:
    name: test-cluster
  url: https://my-suse-observability-instance.com/receiver

# Invalid: gRPC endpoint must include a port (format: host:port).
k8sResourceCollector:
  enabled: true
  crdDiscovery:
    interval: 15m
    discoveryMode: api_groups
    apiGroupFilters:
      include:
        "*": true
      exclude: {}
  rbac:
    useWildcard: true

otel:
  platformGrpcOtlpEndpoint: "otlp-my-instance.example.com"
