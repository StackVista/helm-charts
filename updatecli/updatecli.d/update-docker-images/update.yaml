name: Update Helm Chart Docker Images
pipelineid: docker-images

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: '{{ requiredEnv .scm.branchEnv }}'
{{- if .scm.directory }}
      directory: "{{ .scm.directory }}"
{{- end }}
      user: "{{ env .scm.userEnv }}"
      email: "{{ env .scm.emailEnv }}"
      token: "{{ requiredEnv .scm.tokenEnv }}"
      username: "x-access-token"
      workingbranchseparator: "-"

sources:
  ###################
  # All images with tag x.y.z-soN
  ###################
  clickhouseBackup:
    name: "clickhouse-backup"
    kind: dockerimage
    spec: &dockerSoSpec
      image: "quay.io/stackstate/clickhouse-backup"
      architecture: "linux/amd64"
      tagfilter: "^[0-9]+\\.[0-9]+\\.[0-9]+-so[0-9]+$"
      versionfilter:
        kind: regex/semver
        regex: "^([0-9]+\\.[0-9]+\\.[0-9]+-so[0-9]+)$"
        pattern: ">=0.0.0-0"
  clickhouse:
    name: "clickhouse"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/clickhouse"
  containerTools:
    name: "container-tools"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/container-tools"
  elasticsearch:
    name: "elasticsearch"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/elasticsearch"
  elasticsearchExporter:
    name: "elasticsearch-exporter"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/elasticsearch-exporter"
  hadoop:
    name: "hadoop"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/hadoop"
  jmxExporter:
    name: "jmx-exporter"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/jmx-exporter"
  kafka:
    name: "kafka"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/kafka"
  nginxPrometheusExporter:
    name: "nginx-prometheus-exporter"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/nginx-prometheus-exporter"
  opentelemetryTargetAllocator:
    name: "opentelemetry-target-allocator"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/opentelemetry-target-allocator"
  promtail:
    name: "promtail"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/promtail"
  s3proxy:
    name: "s3proxy"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/s3proxy"
  victoriaMetrics:
    name: "victoria-metrics"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/victoria-metrics"
  vmagent:
    name: "vmagent"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/vmagent"
  vmbackup:
    name: "vmbackup"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/vmbackup"
  vmrestore:
    name: "vmrestore"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/vmrestore"
  wait:
    name: "wait"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/wait"
  zookeeper:
    name: "zookeeper"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/zookeeper"
  envoy:
    name: "envoy"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/envoy"

  ###################
  # Images with other tags
  ###################
  httpHeaderInjectorProxy:
    name: "http-header-injector-proxy"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/http-header-injector-proxy"
  httpHeaderInjectorProxyInit:
    name: "http-header-injector-proxy-init"
    kind: dockerimage
    spec:
      <<: *dockerSoSpec
      image: "quay.io/stackstate/http-header-injector-proxy-init"
  kubernetesRbacAgent:
    name: "kubernetes-rbac-agent"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/kubernetes-rbac-agent"
      architecture: "linux/amd64"
      tagfilter: "^[a-f0-9]{8}-[0-9]+-release$"
      versionfilter:
        kind: regex/semver
        regex: "^[a-f0-9]{8}-([0-9]+)-release$"
  suseObservabilityMcp:
    name: "suse-observability-mcp"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/suse-observability-mcp"
      architecture: "linux/amd64"
      tagfilter: "^[0-9]{14}-[0-9a-f]{8}$"
      versionfilter:
        kind: regex/time
        regex: "^([0-9]{14})-[0-9a-f]{8}$"
        pattern: "20060102150405"
  suseObservabilityBorg:
    name: "suse-observability-borg"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/suse-observability-borg"
      architecture: "linux/amd64"
      tagfilter: "^[0-9]{14}-[0-9a-f]{8}$"
      versionfilter:
        kind: regex/time
        regex: "^([0-9]{14})-[0-9a-f]{8}$"
        pattern: "20060102150405"
  workloadObserver:
    name: "workload-observer"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/workload-observer"
      architecture: "linux/amd64"
      tagfilter: "^[a-f0-9]{8}-[0-9]+-release$"
      versionfilter:
        kind: regex/semver
        regex: "^[a-f0-9]{8}-([0-9]+)-release$"
  kafkaupOperator:
    name: "kafkaup-operator"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/kafkaup-operator"
      architecture: "linux/amd64"
      tagfilter: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      versionfilter:
        kind: semver
  stsOpentelemetryCollector:
    name: "sts-opentelemetry-collector"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/sts-opentelemetry-collector"
      architecture: "linux/amd64"
      tagfilter: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
      versionfilter:
        kind: semver
  genericSidecarInjector:
    name: "generic-sidecar-injector"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/generic-sidecar-injector"
      architecture: "linux/amd64"
      tagfilter: "^[a-f0-9]{8}-[0-9]+-release$"
      versionfilter:
        kind: regex/semver
        regex: "^[a-f0-9]{8}-([0-9]+)-release$"
  spotlight:
    name: "spotlight"
    kind: dockerimage
    spec:
      image: "quay.io/stackstate/spotlight"
      architecture: "linux/amd64"
      tagfilter: "^\\d+\\.\\d+\\.\\d+-snapshot\\.\\d+$"
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"
  # Resolves the latest commit hash and uses it as the image tag. The latest
  # commit may not have its image built/pushed yet; bumping to an unbuilt tag
  # would produce a broken image reference. So before emitting the new hash we
  # verify the consumed image(s) exist in the registry, and otherwise re-emit the
  # CURRENT tag (read from the chart values via scmid: default, so we read the
  # same checkout the targets diff against). Re-emitting the current value yields
  # no diff and thus no bump, while keeping the source/pipeline successful — a
  # failing source would otherwise red-fail the whole shared docker-images run.
  processAgentHash:
    name: "stackstate-process-agent latest commit hash"
    kind: shell
    scmid: default
    spec:
      command: |
        set -euo pipefail

        VALUES_FILE="stable/suse-observability-agent/values.yaml"
        CURRENT="$(yq -r '.nodeAgent.containers.processAgent.image.tag' "$VALUES_FILE")"
        if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
          echo "Could not read current process-agent image tag from $VALUES_FILE" >&2
          exit 1
        fi

        HASH="$(curl -sf "https://api.github.com/repos/StackVista/stackstate-process-agent/commits/master" | jq -r '.sha[0:8]' || true)"
        if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
          echo "Could not resolve stackstate-process-agent commit hash; keeping current tag $CURRENT" >&2
          printf '%s' "$CURRENT"
          exit 0
        fi

        # Only bump to the new hash once its image exists; otherwise keep current.
        if skopeo inspect "docker://quay.io/stackstate/stackstate-k8s-process-agent:${HASH}" >/dev/null 2>&1; then
          printf '%s' "$HASH"
        else
          echo "stackstate-k8s-process-agent:${HASH} not built yet; keeping current tag $CURRENT" >&2
          printf '%s' "$CURRENT"
        fi
  agentHash:
    name: "stackstate-agent latest commit hash"
    kind: shell
    scmid: default
    spec:
      command: |
        set -euo pipefail

        VALUES_FILE="stable/suse-observability-agent/values.yaml"
        # node-, cluster- and checks-agent share this tag; clusterAgent is the canonical read.
        CURRENT="$(yq -r '.clusterAgent.image.tag' "$VALUES_FILE")"
        if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
          echo "Could not read current agent image tag from $VALUES_FILE" >&2
          exit 1
        fi

        HASH="$(curl -sf "https://api.github.com/repos/StackVista/stackstate-agent/commits/stackstate-7.78.2" | jq -r '.sha[0:8]' || true)"
        if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
          echo "Could not resolve stackstate-agent commit hash; keeping current tag $CURRENT" >&2
          printf '%s' "$CURRENT"
          exit 0
        fi

        # The hash feeds the node-, cluster- and checks-agent image tags. Only bump
        # to the new hash once every consumed image exists; otherwise keep current.
        all_built=true
        for image in \
          "quay.io/stackstate/stackstate-k8s-agent:${HASH}" \
          "quay.io/stackstate/stackstate-k8s-cluster-agent:${HASH}"; do
          if ! skopeo inspect "docker://${image}" >/dev/null 2>&1; then
            echo "${image} not built yet; keeping current tag $CURRENT" >&2
            all_built=false
            break
          fi
        done

        if [ "$all_built" = "true" ]; then
          printf '%s' "$HASH"
        else
          printf '%s' "$CURRENT"
        fi

# Single pipeline: each target reads from its own sourceid.
